<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#0a0e13" />
<meta name="robots" content="noindex, nofollow" />
<title>Trabajos de Iluminación</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@0.469.0/dist/umd/lucide.min.js"></script>
<style>
  :root {
    --bg: #070a0f;
    --panel: #10161d;
    --panel-2: #18202a;
    --border: #263241;
    --border-soft: #1c2530;
    --text: #eaf2f8;
    --text-dim: #8497a7;
    --text-faint: #56636f;
    --accent: #7fc7ff;
    --accent-dim: #3f6f8f;
    --violet: #b58bff;
    --gold: #ffd24a;
    --warn: #ff6a55;
    --warn-dim: #4a2c26;
    --ok: #4fd699;
    --ease: cubic-bezier(.22,.8,.3,1);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { min-height: 100%; margin: 0; padding: 0; background: var(--bg); color: var(--text); font-family: 'Barlow', sans-serif; }
  #bg { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none; }
  #fx { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 200; pointer-events: none; }
  #app { position: relative; z-index: 1; min-height: 100vh; width: 100%; padding-bottom: 110px; }
  button { font-family: inherit; }
  button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  /* ---------- Animaciones base ---------- */
  @keyframes fadeUp { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: none; } }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  @keyframes popIn { from { opacity: 0; transform: scale(.94) translateY(10px); } to { opacity: 1; transform: none; } }
  @keyframes sheetIn { from { transform: translateY(100%); } to { transform: none; } }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes pulse {
    0% { box-shadow: 0 0 0 0 rgba(79,214,153,0.5); }
    70% { box-shadow: 0 0 0 6px rgba(79,214,153,0); }
    100% { box-shadow: 0 0 0 0 rgba(79,214,153,0); }
  }
  .anim .enter, .pop { animation: fadeUp .6s var(--ease) backwards; animation-delay: calc(var(--i, 0) * 55ms); }
  .pop { animation-duration: .45s; animation-delay: calc(var(--i, 0) * 50ms); }
  .spin { animation: spin 1s linear infinite; }

  /* ---------- LOGIN ---------- */
  .login-wrap { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
  .login-card {
    width: 100%; max-width: 360px; background: linear-gradient(180deg, rgba(17,23,30,.92), rgba(14,20,26,.92));
    border: 1px solid var(--border-soft); border-radius: 18px; padding: 32px 26px; backdrop-filter: blur(10px);
    box-shadow: 0 30px 80px -30px rgba(0,0,0,.7); animation: popIn .6s var(--ease) both;
  }
  .login-card .logo-mark { margin: 0 auto 16px; width: 46px; height: 46px; border-radius: 12px; }
  .login-card h1 { font-family: 'Barlow Condensed', sans-serif; font-size: 26px; text-align: center; margin: 0 0 4px; }
  .login-card p.sub { text-align: center; color: var(--text-dim); font-size: 13.5px; margin: 0 0 24px; }
  .login-card label { display: block; font-size: 12.5px; color: var(--text-dim); margin-bottom: 6px; }
  .login-card input {
    width: 100%; background: var(--panel-2); border: 1px solid var(--border); border-radius: 10px;
    padding: 12px; color: var(--text); font-size: 15px; margin-bottom: 14px; outline: none;
    font-family: 'Barlow', sans-serif; transition: border-color .2s, box-shadow .2s;
  }
  .login-card input:focus { border-color: var(--accent-dim); box-shadow: 0 0 0 3px rgba(127,199,255,0.14); }
  .login-card button[type=submit] {
    width: 100%; background: var(--accent); color: #06121c; border: none; border-radius: 10px;
    padding: 13px 0; font-weight: 700; font-size: 15.5px; cursor: pointer;
    display: flex; align-items: center; justify-content: center; gap: 8px;
    transition: transform .15s var(--ease), background .2s;
  }
  .login-card button[type=submit]:hover { background: #9ad4ff; }
  .login-card button[type=submit]:active { transform: scale(.98); }
  .login-card button[disabled] { opacity: .7; cursor: wait; }
  .login-error { color: var(--warn); font-size: 13px; margin: -6px 0 14px; animation: fadeIn .3s; }
  .shake { animation: shake .4s; }
  @keyframes shake { 20%,60% { transform: translateX(-6px); } 40%,80% { transform: translateX(6px); } }

  /* ---------- HEADER ---------- */
  .header {
    position: sticky; top: 0; z-index: 20; padding: 14px 20px;
    background: rgba(7,10,15,.7); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    border-bottom: 1px solid var(--border-soft);
  }
  .header-inner { max-width: 780px; margin: 0 auto; display: flex; align-items: center; gap: 12px; }
  .logo-mark {
    width: 36px; height: 36px; border-radius: 9px; background: linear-gradient(160deg, #1d2a36, #0d1319);
    border: 1px solid var(--border); display: flex; align-items: center; justify-content: center;
    color: var(--accent); flex-shrink: 0; box-shadow: 0 0 18px -6px var(--accent);
  }
  .title-block h1 { font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 23px; margin: 0; line-height: 1.1; }
  .title-block p { margin: 1px 0 0; color: var(--text-dim); font-size: 12.5px; }
  .sync-info { margin-left: auto; display: flex; align-items: center; gap: 6px; font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: var(--text-faint); }
  .sync-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--ok); animation: pulse 2s infinite; }
  .logout-btn {
    background: transparent; border: 1px solid var(--border); color: var(--text-dim);
    border-radius: 9px; width: 36px; height: 36px; display: flex; align-items: center; justify-content: center;
    cursor: pointer; flex-shrink: 0; transition: all .2s;
  }
  .logout-btn:hover { color: var(--warn); border-color: rgba(255,106,85,0.4); background: rgba(255,106,85,.06); }

  .content { max-width: 780px; margin: 0 auto; padding: 20px 20px 0; }
  .quake { animation: quake .5s; }
  @keyframes quake { 10% { transform: translate(-7px,3px); } 30% { transform: translate(6px,-4px); } 50% { transform: translate(-5px,-2px); } 70% { transform: translate(3px,3px); } 90% { transform: translate(-1px,1px); } }

  /* ---------- HERO (dinero) ---------- */
  .hero { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 12px; }
  @media (max-width: 520px) { .hero { grid-template-columns: 1fr; } }
  .money-card {
    position: relative; overflow: hidden; text-align: left; color: var(--text); cursor: pointer; width: 100%;
    border-radius: 18px; padding: 18px 18px 16px; background: linear-gradient(160deg, rgba(20,28,37,.95), rgba(12,17,23,.95));
    border: 1px solid var(--border-soft); transition: transform .3s var(--ease), border-color .3s, box-shadow .3s;
  }
  .money-card:hover { transform: translateY(-3px); }
  .money-card::after {
    content: ""; position: absolute; inset: 0; pointer-events: none;
    background: linear-gradient(115deg, transparent 35%, rgba(255,255,255,.09) 50%, transparent 65%);
    transform: translateX(-130%); animation: shine 6s ease-in-out infinite;
  }
  .money-card.pend::after { animation-delay: 1.4s; }
  @keyframes shine { 0%, 55% { transform: translateX(-130%); } 100% { transform: translateX(130%); } }
  .money-card.ok { border-color: rgba(79,214,153,.32); box-shadow: 0 0 46px -24px var(--ok); }
  .money-card.pend { border-color: rgba(127,199,255,.32); box-shadow: 0 0 46px -24px var(--accent); }
  .money-card .lbl { font-size: 11.5px; text-transform: uppercase; letter-spacing: .12em; color: var(--text-dim); display: flex; align-items: center; gap: 7px; }
  .money-card .lbl svg { width: 14px; height: 14px; }
  .money-card.ok .lbl svg, .money-card.ok .big { color: var(--ok); }
  .money-card.pend .lbl svg, .money-card.pend .big { color: var(--accent); }
  .money-card .big { font-family: 'IBM Plex Mono', monospace; font-weight: 600; font-size: clamp(24px, 6.4vw, 33px); margin-top: 10px; white-space: nowrap; letter-spacing: -.02em; }

  .progress { margin-bottom: 14px; }
  .progress-top { display: flex; justify-content: space-between; font-size: 12px; color: var(--text-dim); margin-bottom: 6px; font-family: 'IBM Plex Mono', monospace; }
  .progress-track { height: 8px; border-radius: 999px; background: var(--panel-2); overflow: hidden; }
  .progress-fill {
    height: 100%; width: var(--p); border-radius: inherit; position: relative;
    background: linear-gradient(90deg, #2fbf86, var(--ok), #b9ffd9); box-shadow: 0 0 14px rgba(79,214,153,.6);
    transform-origin: left; animation: grow 1.2s var(--ease) backwards;
  }
  @keyframes grow { from { transform: scaleX(0); } }

  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }
  .chip {
    display: inline-flex; align-items: center; gap: 7px; background: var(--panel); border: 1px solid var(--border-soft);
    color: var(--text-dim); border-radius: 999px; padding: 6px 12px; font-size: 12.5px; cursor: default;
  }
  .chip b { font-family: 'IBM Plex Mono', monospace; color: var(--text); font-weight: 600; }
  .chip.warn { color: var(--warn); border-color: rgba(255,106,85,.4); background: rgba(255,106,85,.07); cursor: pointer; }
  .chip.warn b { color: var(--warn); }
  .chip.warn:hover { background: rgba(255,106,85,.14); }

  /* ---------- SELECTOR DE VISTA ---------- */
  .seg { display: flex; position: relative; background: rgba(16,22,29,.9); border: 1px solid var(--border-soft); border-radius: 14px; padding: 4px; margin-bottom: 16px; }
  .seg .thumb {
    position: absolute; top: 4px; bottom: 4px; left: 4px; width: calc((100% - 8px) / 5); border-radius: 10px;
    background: linear-gradient(160deg, #22303d, #1a2530); box-shadow: inset 0 0 0 1px var(--border), 0 0 20px -8px var(--accent);
  }
  .seg[data-view="cal"] .thumb { transform: translateX(100%); }
  .seg[data-view="gastos"] .thumb { transform: translateX(200%); }
  .seg[data-view="dolares"] .thumb { transform: translateX(300%); }
  .seg[data-view="resumen"] .thumb { transform: translateX(400%); }
  .seg .thumb.slide { animation: thumbSlide .5s var(--ease); }
  @keyframes thumbSlide { from { transform: translateX(var(--from)); } }
  .seg button {
    position: relative; flex: 1; background: transparent; border: none; color: var(--text-dim); cursor: pointer;
    font-family: 'Barlow Condensed', sans-serif; font-weight: 600; font-size: 17px; padding: 10px 8px;
    display: flex; align-items: center; justify-content: center; gap: 8px; transition: color .25s;
  }
  .seg button.active { color: var(--text); }
  .seg button svg { width: 17px; height: 17px; }

  /* ---------- TOOLBAR / FILTROS ---------- */
  .search {
    display: flex; align-items: center; gap: 8px; background: rgba(16,22,29,.9); margin-bottom: 12px;
    border: 1px solid var(--border-soft); border-radius: 12px; padding: 0 13px; transition: border-color .2s, box-shadow .2s;
  }
  .search:focus-within { border-color: var(--accent-dim); box-shadow: 0 0 0 3px rgba(127,199,255,0.1); }
  .search svg { color: var(--text-faint); flex-shrink: 0; width: 16px; height: 16px; }
  .search input { background: transparent; border: none; outline: none !important; color: var(--text); font-family: 'Barlow', sans-serif; font-size: 15px; padding: 12px 0; width: 100%; }
  .search input::placeholder { color: var(--text-faint); }
  .filters { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; margin-bottom: 14px; scrollbar-width: none; }
  .filters::-webkit-scrollbar { display: none; }
  .fchip {
    flex-shrink: 0; background: transparent; border: 1px solid var(--border); color: var(--text-dim); border-radius: 999px;
    padding: 6px 14px; font-size: 13px; font-weight: 500; cursor: pointer; transition: all .25s var(--ease);
  }
  .fchip:hover { color: var(--text); border-color: var(--accent-dim); }
  .fchip.active { color: #06121c; background: var(--accent); border-color: var(--accent); font-weight: 700; box-shadow: 0 0 18px -4px rgba(127,199,255,.7); }

  .add-btn, .submit-btn {
    background: var(--accent); color: #06121c; border: none; border-radius: 10px; padding: 0 18px;
    font-weight: 600; font-size: 14.5px; display: flex; align-items: center; gap: 6px;
    cursor: pointer; white-space: nowrap; transition: transform .15s var(--ease), background .2s, box-shadow .2s;
  }
  .add-btn:hover, .submit-btn:hover { background: #9ad4ff; box-shadow: 0 6px 20px -8px rgba(127,199,255,.6); }
  .add-btn:active, .submit-btn:active { transform: scale(.97); }
  .submit-btn { padding: 15px 0; font-size: 16.5px; font-weight: 700; border-radius: 12px; width: 100%; justify-content: center; }

  .fab {
    position: fixed; right: 22px; bottom: 24px; z-index: 40; width: 60px; height: 60px; border-radius: 50%; border: none;
    background: linear-gradient(145deg, #a6dbff, var(--accent) 45%, #5aa9e6); color: #06121c; cursor: pointer;
    display: flex; align-items: center; justify-content: center; box-shadow: 0 10px 30px -6px rgba(127,199,255,.7);
    transition: transform .35s var(--ease);
  }
  .fab svg { width: 26px; height: 26px; transition: transform .35s var(--ease); }
  .fab:hover { transform: scale(1.1); }
  .fab:hover svg { transform: rotate(90deg); }
  .fab:active { transform: scale(.94); }
  .fab::before { content: ""; position: absolute; inset: 0; border-radius: 50%; border: 2px solid var(--accent); animation: fabRing 2.4s ease-out infinite; }
  @keyframes fabRing { from { transform: scale(1); opacity: .7; } to { transform: scale(1.7); opacity: 0; } }

  /* ---------- LISTA / TARJETAS ---------- */
  .list { display: flex; flex-direction: column; gap: 10px; }
  .job {
    background: rgba(16,22,29,.92); border: 1px solid var(--border-soft); border-radius: 15px; padding: 14px 15px;
    position: relative; transition: transform .25s var(--ease), border-color .25s, box-shadow .25s;
  }
  .job:hover { transform: translateY(-3px); border-color: var(--border); box-shadow: 0 16px 34px -18px rgba(0,0,0,.9); }
  .job.has-warning { border-color: rgba(255,106,85,0.3); }
  .job.fresh::before, .job.paid-now::before {
    content: ""; position: absolute; inset: -2px; border-radius: 17px; pointer-events: none;
    border: 2px solid var(--accent); box-shadow: 0 0 30px var(--accent); animation: freshRing 2s ease-out forwards;
  }
  .job.paid-now::before { border-color: var(--gold); box-shadow: 0 0 34px var(--gold); }
  @keyframes freshRing { 0% { opacity: 1; transform: scale(.97); } 100% { opacity: 0; transform: scale(1.03); } }
  .job-top { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 7px; }
  .job-fecha { font-family: 'IBM Plex Mono', monospace; font-size: 12.5px; color: var(--accent); }
  .job-lugar-row { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; margin-bottom: 10px; padding-right: 64px; }
  .job-lugar { font-size: 16.5px; font-weight: 600; word-break: break-word; }
  .job-meta { display: flex; flex-wrap: wrap; gap: 7px; align-items: center; }
  .job-meta + .job-meta { margin-top: 8px; }
  .tag { display: inline-flex; align-items: center; gap: 5px; font-size: 12.5px; padding: 4px 9px; border-radius: 7px; border: 1px solid var(--border); color: var(--text-dim); }
  .tag svg { width: 13px; height: 13px; }
  .tag.warn { color: var(--warn); border-color: rgba(255,106,85,0.4); background: rgba(255,106,85,0.07); }
  .tag.ok-tag { color: var(--ok); border-color: rgba(79,214,153,0.4); background: rgba(79,214,153,0.08); cursor: pointer; transition: background .2s; }
  .tag.ok-tag:hover { background: rgba(79,214,153,0.16); }

  .sent-pill {
    display: inline-flex; align-items: center; gap: 4px; font-size: 11px; font-weight: 700;
    letter-spacing: .06em; text-transform: uppercase; padding: 3px 8px 3px 6px; border-radius: 999px; white-space: nowrap; line-height: 1.2;
  }
  .sent-pill svg { width: 12px; height: 12px; }
  .sent-pill.yes { color: #06281a; background: var(--ok); box-shadow: 0 0 0 3px rgba(79,214,153,.14); }
  .sent-pill.no { color: var(--text-faint); background: transparent; border: 1px dashed var(--border); font-weight: 600; }

  .cobrar-btn {
    display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 700;
    padding: 8px 14px; border-radius: 9px; border: 1px solid rgba(255,210,74,.5); color: var(--gold);
    background: linear-gradient(160deg, rgba(255,210,74,.14), rgba(255,160,40,.06)); cursor: pointer; transition: all .25s var(--ease);
  }
  .cobrar-btn:hover { background: rgba(255,210,74,.22); box-shadow: 0 0 22px -4px rgba(255,210,74,.6); transform: translateY(-1px); }
  .cobrar-btn:active { transform: scale(.96); }
  .cobrar-btn svg { width: 14px; height: 14px; }
  .job-monto { font-family: 'IBM Plex Mono', monospace; font-weight: 600; color: var(--text); margin-left: auto; border: none; padding: 0; font-size: 15px; }

  .job-actions { position: absolute; top: 11px; right: 11px; display: flex; gap: 2px; }
  .icon-btn { background: transparent; border: none; color: var(--text-faint); cursor: pointer; padding: 6px; border-radius: 7px; display: flex; transition: all .2s; }
  .icon-btn svg { width: 15px; height: 15px; }
  .icon-btn:hover { color: var(--text); background: var(--panel-2); }
  .icon-btn.danger:hover { color: var(--warn); }
  .confirm-row { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--text-dim); animation: fadeIn .25s; }
  .confirm-row button { font-size: 12.5px; font-weight: 600; border: none; border-radius: 6px; padding: 4px 10px; cursor: pointer; }
  .confirm-row .yes { background: var(--warn); color: #240a06; }
  .confirm-row .no { background: var(--panel-2); color: var(--text-dim); }

  .empty { text-align: center; padding: 44px 20px; color: var(--text-dim); border: 1px dashed var(--border); border-radius: 16px; animation: fadeUp .5s var(--ease); background: rgba(16,22,29,.5); }
  .empty h3 { font-family: 'Barlow Condensed', sans-serif; color: var(--text); font-size: 20px; margin: 0 0 6px; }
  .empty p { font-size: 13.5px; margin: 0 0 16px; }
  .empty .add-btn { margin: 0 auto; padding: 11px 18px; }
  .loading-wrap { display: flex; align-items: center; justify-content: center; gap: 8px; padding: 70px 0; color: var(--text-dim); font-size: 14px; }

  /* ---------- CALENDARIO ---------- */
  .cal { background: rgba(16,22,29,.92); border: 1px solid var(--border-soft); border-radius: 18px; padding: 16px; margin-bottom: 16px; overflow: hidden; }
  .cal-head { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
  .cal-title { flex: 1; min-width: 0; }
  .cal-title h2 { font-family: 'Barlow Condensed', sans-serif; font-size: 26px; font-weight: 700; margin: 0; text-transform: capitalize; line-height: 1.1; }
  .cal-title p { margin: 3px 0 0; font-size: 12.5px; color: var(--text-dim); font-family: 'IBM Plex Mono', monospace; }
  .cal-nav { display: flex; gap: 6px; }
  .cal-nav button {
    background: var(--panel-2); border: 1px solid var(--border); color: var(--text-dim); border-radius: 10px;
    height: 36px; min-width: 36px; padding: 0 10px; display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 12.5px; font-weight: 600; transition: all .2s;
  }
  .cal-nav button:hover { color: var(--text); border-color: var(--accent-dim); transform: translateY(-1px); }
  .cal-nav svg { width: 17px; height: 17px; }
  .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
  .cal-grid.slide-next { animation: slideNext .45s var(--ease); }
  .cal-grid.slide-prev { animation: slidePrev .45s var(--ease); }
  @keyframes slideNext { from { opacity: 0; transform: translateX(36px); } }
  @keyframes slidePrev { from { opacity: 0; transform: translateX(-36px); } }
  .cal-dow { text-align: center; font-size: 10.5px; color: var(--text-faint); text-transform: uppercase; letter-spacing: .08em; padding: 2px 0 6px; }
  .cal-day {
    position: relative; aspect-ratio: 1 / 1.08; min-height: 52px; background: var(--panel-2); border: 1px solid transparent; border-radius: 11px;
    padding: 6px 5px 5px; cursor: pointer; text-align: left; color: var(--text); display: flex; flex-direction: column;
    transition: transform .25s var(--ease), border-color .25s, box-shadow .25s, background .25s;
  }
  .cal-day.blank { visibility: hidden; pointer-events: none; }
  .cal-day:hover { transform: translateY(-3px) scale(1.06); border-color: var(--accent-dim); z-index: 2; box-shadow: 0 10px 22px -10px rgba(0,0,0,.9); }
  .cal-day .n { font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: var(--text-faint); }
  .cal-day.has .n { color: var(--text); font-weight: 600; }
  .cal-day.has { background: linear-gradient(160deg, #1d2a37, #172029); }
  .cal-day.today { border-color: var(--accent); }
  .cal-day.today .n { color: var(--accent); }
  .cal-day.sel { background: rgba(127,199,255,.16); border-color: var(--accent); box-shadow: 0 0 26px -6px var(--accent); transform: translateY(-2px); }
  .dots { display: flex; flex-wrap: wrap; gap: 4px; margin-top: auto; align-items: center; }
  .dot { width: 9px; height: 9px; border-radius: 50%; animation: dotPop .5s var(--ease) backwards; animation-delay: calc(var(--i) * 70ms + .25s); }
  @keyframes dotPop { from { transform: scale(0); } 60% { transform: scale(1.5); } }
  .dot.paid { background: var(--gold); box-shadow: 0 0 9px var(--gold); }

  /* ---------- AVISOS, SIMULADOR, MOVIMIENTOS ---------- */
  .banner { display: flex; gap: 12px; align-items: flex-start; border-radius: 16px; padding: 14px 16px; margin-bottom: 12px; font-size: 14.5px; line-height: 1.45; border: 1px solid var(--border-soft); -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px); }

  .mov-row { display: grid; grid-template-columns: 78px 130px 1fr auto; gap: 10px; align-items: center; padding: 9px 0; border-top: 1px solid var(--border-soft); font-size: 13px; }

    const usd = (n) => "US$ " + (Number(n) || 0).toLocaleString("es-AR", { maximumFractionDigits: 2 });
    const fmtPct = (p) => (p >= 0 ? "+" : "−") + Math.abs(p).toFixed(1).replace(".", ",") + "%";
    function fechaLarga(iso) {

    /* =====================================================================
       VIDEO DE FONDO: pantalla completa, cambia cada 15 s con fundido.
       Para sumar más fondos: copiá el video a la carpeta "fondos" (versión
       hd 1280px y sd 854px, sin audio) y agregalo a esta lista.
       ===================================================================== */
    const FONDOS = Array.from({ length: 17 }, (_, i) => ({
      hd: `fondos/fondo-${i + 1}-hd.mp4`, sd: `fondos/fondo-${i + 1}-sd.mp4`,
    })).sort(() => Math.random() - 0.5); // orden distinto en cada visita
    const FONDO_CADA_MS = 15000;
    (function iniciarFondos() {
      const vids = [...document.querySelectorAll("#vbg video")];
      const ahorro = navigator.connection && navigator.connection.saveData;
      if (!vids.length || reduce || ahorro || !FONDOS.length) return; // queda solo la imagen
      let cur = 0, idx = 0;
      const srcDe = (f) => (innerWidth <= 720 ? f.sd : f.hd);
      function cambiar(primero) {
        const f = FONDOS[idx++ % FONDOS.length];
        const prev = vids[cur], next = vids[cur ^ 1], src = srcDe(f);
        const mostrar = () => {
          if (!primero && FONDOS.length === 1 && next.duration) next.currentTime = rand(0, Math.max(0, next.duration - 1));
          next.play().then(() => {
            next.classList.add("on");
            if (!primero) { prev.classList.remove("on"); setTimeout(() => prev.pause(), 2000); }
            cur ^= 1;
          }).catch(() => {});
        };
        if (next.dataset.src !== src) {
          next.dataset.src = src; next.muted = true; next.playsInline = true;
          next.src = src;
          next.addEventListener("loadeddata", mostrar, { once: true });
          next.load();
        } else mostrar();
      }
      cambiar(true);
      setInterval(() => { if (!document.hidden) cambiar(false); }, FONDO_CADA_MS);
    })();

    /* =====================================================================
       FONDO ANIMADO: haces de luz de escenario + polvo flotante
       ===================================================================== */
    const bgC = document.getElementById("bg");
    const bctx = bgC.getContext("2d");
    const fxC = document.getElementById("fx");
    const fx = fxC.getContext("2d");
    let W = 0, H = 0, mouseX = 0.5;

    function sizeCanvases() {
      const d = Math.min(window.devicePixelRatio || 1, 2);
      W = innerWidth; H = innerHeight;
      for (const c of [bgC, fxC]) {
        c.width = W * d; c.height = H * d;
        c.getContext("2d").setTransform(d, 0, 0, d, 0, 0);
      }
    }
    sizeCanvases();
    addEventListener("resize", sizeCanvases);
    addEventListener("pointermove", (e) => { mouseX = e.clientX / Math.max(1, innerWidth); }, { passive: true });

    const beams = [
      { x: 0.12, hue: 205, ph: 0.0, sp: 0.00042, w: 0.10 },
      { x: 0.38, hue: 268, ph: 1.7, sp: 0.00031, w: 0.12 },
      { x: 0.64, hue: 160, ph: 3.1, sp: 0.00038, w: 0.09 },
      { x: 0.88, hue: 215, ph: 4.6, sp: 0.00028, w: 0.11 },
    ];
    const dust = Array.from({ length: 70 }, () => ({
      x: Math.random(), y: Math.random(), r: rand(0.6, 2.2), s: rand(0.00004, 0.00016), ph: rand(0, 6.28),
    }));

    function drawBg(t) {
      bctx.clearRect(0, 0, W, H);
      bctx.globalCompositeOperation = "lighter";
      const len = Math.hypot(W, H) * 1.05;
      for (const b of beams) {
        const ang = Math.sin(t * b.sp + b.ph) * 0.5 + (mouseX - 0.5) * 0.35;
        const ox = b.x * W, oy = -30;
        const ex = ox + Math.sin(ang) * len, ey = oy + Math.cos(ang) * len;
        const nx = Math.cos(ang), ny = -Math.sin(ang), half = len * Math.tan(b.w);
        const g = bctx.createLinearGradient(ox, oy, ex, ey);
        g.addColorStop(0, `hsla(${b.hue},90%,65%,.20)`);
        g.addColorStop(0.55, `hsla(${b.hue},90%,60%,.06)`);
        g.addColorStop(1, `hsla(${b.hue},90%,60%,0)`);
        bctx.fillStyle = g;
        bctx.beginPath();
        bctx.moveTo(ox, oy);
        bctx.lineTo(ex + nx * half, ey + ny * half);
        bctx.lineTo(ex - nx * half, ey - ny * half);
        bctx.closePath();
        bctx.fill();
      }
      for (const p of dust) {
        const y = ((p.y - t * p.s) % 1 + 1) % 1;
        const x = p.x + Math.sin(t * 0.0003 + p.ph) * 0.012;
        bctx.globalAlpha = 0.25 + 0.35 * Math.sin(t * 0.001 + p.ph) ** 2;
        bctx.fillStyle = "#cfe8ff";
        bctx.beginPath();
        bctx.arc(x * W, y * H, p.r, 0, 6.2832);
        bctx.fill();
      }
      bctx.globalAlpha = 1;
    }
    function bgLoop(t) {
      if (!document.hidden) drawBg(t);
      requestAnimationFrame(bgLoop);
    }
    if (reduce) drawBg(2000); else requestAnimationFrame(bgLoop);

    /* =====================================================================
       EFECTOS ESPECIALES (partículas)
       ===================================================================== */
    let parts = [];
    let fxRunning = false;

    function P(o) {
      parts.push({ life: 0, max: 70, x: 0, y: 0, vx: 0, vy: 0, g: 0, drag: 0.985, size: 3, color: "#fff", type: "spark", rot: 0, vr: 0, swirl: 0, maxR: 200, ...o });
    }
    function startFx() {
      if (!fxRunning) { fxRunning = true; requestAnimationFrame(fxLoop); }
    }
    function fxLoop() {
      fx.clearRect(0, 0, W, H);
      parts = parts.filter((p) => p.life < p.max);
      for (const p of parts) {
        p.life++;
        if (p.life <= 0) continue;
        const t = p.life / p.max;
        if (p.swirl) {
          const c = Math.cos(p.swirl), s = Math.sin(p.swirl);
          const vx = p.vx * c - p.vy * s;
          p.vy = p.vx * s + p.vy * c; p.vx = vx;
        }
        p.vx *= p.drag; p.vy = p.vy * p.drag + p.g;
        p.x += p.vx; p.y += p.vy; p.rot += p.vr;
        drawParticle(p, t);
      }
      if (parts.length) requestAnimationFrame(fxLoop);
      else { fxRunning = false; fx.clearRect(0, 0, W, H); }
    }
    function drawParticle(p, t) {
      const a = Math.max(0, 1 - t * t * t);
      if (p.type === "ring") {
        const e = 1 - Math.pow(1 - t, 3);
        fx.globalCompositeOperation = "lighter";
        fx.globalAlpha = a; fx.strokeStyle = p.color; fx.lineWidth = 1 + 6 * (1 - t);
        fx.beginPath(); fx.arc(p.x, p.y, p.size + (p.maxR - p.size) * e, 0, 6.2832); fx.stroke();
      } else if (p.type === "coin") {
        fx.globalCompositeOperation = "source-over";
        fx.globalAlpha = Math.min(1, a * 1.6);
        const c = Math.cos(p.rot);
        fx.fillStyle = c > 0 ? "#ffd24a" : "#e8a200";
        fx.strokeStyle = "#fff3b0"; fx.lineWidth = 1;
        fx.beginPath(); fx.ellipse(p.x, p.y, Math.max(0.7, Math.abs(c) * p.size), p.size, 0, 0, 6.2832); fx.fill(); fx.stroke();
      } else if (p.type === "streak") {
        fx.globalCompositeOperation = "lighter";
        fx.globalAlpha = a; fx.strokeStyle = p.color; fx.lineWidth = p.size; fx.lineCap = "round";
        fx.beginPath(); fx.moveTo(p.x - p.vx * 3, p.y - p.vy * 3); fx.lineTo(p.x, p.y); fx.stroke();
      } else {
        fx.globalCompositeOperation = "lighter";
        const s = p.size * (1 - t * 0.6) * (0.75 + 0.25 * Math.sin(p.life * 0.6));
        fx.fillStyle = p.color;
        fx.globalAlpha = a * 0.25; fx.beginPath(); fx.arc(p.x, p.y, s * 2.2, 0, 6.2832); fx.fill();
        fx.globalAlpha = a; fx.save(); fx.translate(p.x, p.y); fx.rotate(p.rot); fx.beginPath();
        for (let i = 0; i < 8; i++) {
          const r = i % 2 ? s * 0.35 : s * 1.6, ang = i * Math.PI / 4;
          fx.lineTo(Math.cos(ang) * r, Math.sin(ang) * r);
        }
        fx.closePath(); fx.fill(); fx.restore();
      }
      fx.globalAlpha = 1; fx.globalCompositeOperation = "source-over";
    }

    function flash(x, y, kind) {
      const el = document.createElement("div");
      el.className = "flash " + (kind || "");

    // ¡Cobrado! lluvia de monedas, ondas de choque y destellos dorados

      for (let i = 0; i < 70; i++) {
        const ang = rand(-Math.PI * 0.95, -Math.PI * 0.05), sp = rand(6, 17);

            size: rand(5, 9), rot: rand(0, 6), vr: rand(0.15, 0.4), max: rand(75, 120) });

      for (let i = 0; i < 120; i++) {
        const ang = rand(0, 6.2832), sp = rand(2, 14);

      for (let i = 0; i < 40; i++) {

    // Chispas pequeñas para micro-interacciones
    function fxMini(x, y, color, n = 16) {
      if (reduce) return;

        const ang = rand(0, 6.2832), sp = rand(1.5, 6);

            color: color || pick(["#7fc7ff", "#ffffff"]), vr: rand(-0.1, 0.1), max: rand(25, 45) });

    /* Números que "cuentan" hasta su valor, mostrando siempre el monto entero */
    const prevVals = {};
    function animateNumbers() {
      document.querySelectorAll("[data-count]").forEach((el) => {
        const to = Number(el.dataset.count), key = el.dataset.key, from = prevVals[key] ?? 0;
        prevVals[key] = to;
        if (reduce || from === to) return;
        const t0 = performance.now(), dur = 1000;
        const tick = (now) => {
          if (!el.isConnected) return;
          const k = Math.min(1, (now - t0) / dur), e = 1 - Math.pow(1 - k, 3);
          const val = from + (to - from) * e;
          el.textContent = el.dataset.fmt === "usd" ? usd(val) : money(val);
          if (k < 1) requestAnimationFrame(tick);
        };
        requestAnimationFrame(tick);
      });

    /* =====================================================================
       AUTENTICACIÓN Y DATOS
       ===================================================================== */
    let unsubscribeTrabajos = null;
    let unsubscribeGastos = null;
    let unsubscribeAjuste = null;
    let unsubscribeAhorro = null;
    let dolarTimer = null;
    const CH_W = 700, CH_H = 250;

    /* ---- Dólares (blue, oficial, MEP, CCL, cripto, mayorista, tarjeta): historial diario + cotización en vivo ---- */
    const CASAS = [
      ["blue", "Blue", "El de la calle: el billete físico que se compra y vende en cuevas. Es el que más se parece a tu dólar en mano."],
      ["oficial", "Oficial", "El del banco. Es el precio regulado por el Gobierno."],
      ["bolsa", "MEP", "Dólar Bolsa o MEP: se compra con pesos vía bonos o acciones, de forma legal y digital."],

      ["cripto", "Cripto", "Dólar en criptomonedas estables (como USDT), que se compra por apps."],
      ["mayorista", "Mayorista", "El que usan los bancos y empresas entre sí. No es para personas."],
      ["tarjeta", "Tarjeta", "Oficial más impuestos: lo que se paga en consumos en dólares con tarjeta."],
    ];
    const nombreCasa = (c) => (CASAS.find((x) => x[0] === c) || [c, c])[1];
    function refrescarDolarVista() {
      if (state.view === "dolares" && !state.showAhorro && !state.showForm && !state.showSaldo) { state.animate = false; render(); }
    }
    async function cargarDolarHist(casa = state.casa) {
      if (state.histCasa[casa]) return;
      try {
        const r = await fetch("https://api.argentinadatos.com/v1/cotizaciones/dolares/" + casa);
        if (!r.ok) throw new Error("HTTP " + r.status);
        const all = await r.json();
        state.histCasa[casa] = all.slice(-460).map((x) => ({ fecha: x.fecha, compra: x.compra, venta: x.venta }));
        state.dolarError = "";
      } catch (e) {
        state.dolarError = "No se pudo cargar el historial del dólar (" + e.message + ").";
      }
      refrescarDolarVista();
    }
    async function cargarDolarVivo() {
      try {
        const r = await fetch("https://dolarapi.com/v1/dolares", { cache: "no-store" });
        if (!r.ok) throw new Error("HTTP " + r.status);
        const lista = await r.json();
        const ahora = Date.now();
        lista.forEach((j) => { state.dolares[j.casa] = { compra: j.compra, venta: j.venta, fechaApi: j.fechaActualizacion, leido: ahora }; });
        state.dolarError = "";
        revisarAlerta();
      } catch (e) {
        state.dolarError = "Sin conexión con el servicio de cotización. Se muestra el último valor conocido.";
      }
      refrescarDolarVista();
    }
    function iniciarDolar() {
      cargarDolarHist(); cargarDolarVivo();
      clearInterval(dolarTimer);
      dolarTimer = setInterval(() => { if (!document.hidden) cargarDolarVivo(); }, 60000);
    }
    function detenerDolar() { clearInterval(dolarTimer); dolarTimer = null; }

    function serieDolar() {
      const s = (state.histCasa[state.casa] || []).map((x) => ({ ...x }));
      const cur = state.dolares[state.casa];
      if (cur) {
        const p = { fecha: hoyIso, compra: cur.compra, venta: cur.venta };
        if (s.length && s[s.length - 1].fecha === hoyIso) s[s.length - 1] = p; else s.push(p);
      }
      return s;
    }
    function valorHace(serie, dias, tipo) {
      const d = new Date(); d.setDate(d.getDate() - dias);
      const lim = isoDay(d.getFullYear(), d.getMonth(), d.getDate());
      for (let i = serie.length - 1; i >= 0; i--) if (serie[i].fecha <= lim) return serie[i][tipo];
      return null;
    }
    // Toda la colección "ajustes" en un solo listener: ahorro_usd, saldo, alerta y los movimientos (mov_*).
    function suscribirAhorro() {
      if (unsubscribeAhorro) unsubscribeAhorro();
      unsubscribeAhorro = onSnapshot(
        collection(db, "ajustes"),
        (snap) => {
          let ah = { usd: 0 }, aj = 0, al = null;
          const movs = [];
          snap.forEach((d) => {
            const x = d.data(), id = d.id;
            if (id === "ahorro_usd") ah = x;
            else if (id === "saldo") aj = Number(x.ajuste) || 0;
            else if (id === "alerta") al = x;
            else if (id.startsWith("mov_")) movs.push({ id, ...x });
          });
          movs.sort((a, b) => (a.fecha < b.fecha ? -1 : a.fecha > b.fecha ? 1 : (a.creadoEn || 0) - (b.creadoEn || 0)));
          state.ahorro = ah; state.ajuste = aj; state.movs = movs;
          if (al) state.alerta = { ...state.alerta, ...al };
          const abierto = state.showAhorro || state.showSaldo || state.showForm;
          if ((state.view === "dolares" || state.view === "gastos") && !abierto) { state.animate = false; render(); }
        },
        () => {}
      );
    }
    function serieUsd() {
      const pts = state.movs.map((m) => ({ fecha: m.fecha, v: Number(m.total) || 0 }));
      const u = Number(state.ahorro.usd) || 0, last = pts[pts.length - 1];
      if (pts.length && (!last || last.fecha < hoyIso)) pts.push({ fecha: hoyIso, v: u });
      return pts;
    }
    /* ---- Alertas del dólar: aviso en la web (y en el navegador si lo permitís). El celular lo hace DolarWorker. ---- */
    const lsGet = (k) => { try { return localStorage.getItem(k); } catch { return null; } };
    const lsSet = (k, v) => { try { localStorage.setItem(k, v); } catch { /* sin almacenamiento */ } };
    function mostrarAviso(titulo, texto, tipo) {
      const el = document.createElement("div");
      el.className = "aviso " + (tipo || "");
      el.innerHTML = `<b>${esc(titulo)}</b><span>${esc(texto)}</span>`;
      el.addEventListener("click", () => el.remove());
      document.body.appendChild(el);
      setTimeout(() => el.remove(), 10000);
    }
    function revisarAlerta() {
      const al = state.alerta;
      if (!al.activa) return;
      const cur = state.dolares[al.casa];
      if (!cur) return;
      const v = cur[al.tipo], key = `refDolar_${al.casa}_${al.tipo}`, ref = Number(lsGet(key));
      if (!ref) { lsSet(key, String(v)); return; }
      const pct = (v / ref - 1) * 100;
      if (Math.abs(pct) < (Number(al.umbralPct) || 1)) return;
      const u = Number(state.ahorro.usd) || 0, sube = pct > 0;
      const titulo = `${sube ? "▲ Subió" : "▼ Bajó"} el dólar ${nombreCasa(al.casa)} ${fmtPct(pct)}`;
      const texto = `${money(ref)} → ${money(v)}.` + (u ? ` Tus ${usd(u)} ${sube ? "valen" : "ahora valen"} ${money(Math.abs(u * (v - ref)))} ${sube ? "más" : "menos"}.` : "");
      mostrarAviso(titulo, texto, sube ? "up" : "down");
      if ("Notification" in window && Notification.permission === "granted") { try { new Notification(titulo, { body: texto }); } catch { /* no soportado */ } }
      lsSet(key, String(v));
    }
    async function guardarAlerta(cambios) {
      const n = { ...state.alerta, casa: state.casa, tipo: state.tipoCot, ...cambios };
      state.alerta = n;
      try {
        await setDoc(doc(db, "ajustes", "alerta"), { activa: !!n.activa, casa: n.casa, tipo: n.tipo, umbralPct: Number(n.umbralPct) || 1, actualizadoEn: Date.now() });
        state.saveError = "";
      } catch (err) {
        state.saveError = "No se pudo guardar la alerta: " + err.message;
      }
      lsSet(`refDolar_${n.casa}_${n.tipo}`, String((state.dolares[n.casa] || {})[n.tipo] || ""));
      state.animate = false; render();
    }
    async function guardarMovimiento(f, reiniciar) {
      const a = state.ahorro, actual = Number(a.usd) || 0, monto = Math.abs(Number(f.monto) || 0);
      const nuevo = f.modo === "sumar" ? actual + monto : f.modo === "retirar" ? Math.max(0, actual - monto) : monto;
      const delta = nuevo - actual;
      const data = { usd: nuevo, actualizadoEn: Date.now(), bases: a.bases || {}, baseFecha: a.baseFecha || "" };
      if ((reiniciar || !Object.keys(data.bases).length) && Object.keys(state.dolares).length) {
        // Se guarda la cotización de hoy de todos los dólares, así la comparación sirve para cualquiera que elijas.
        data.bases = {};
        Object.entries(state.dolares).forEach(([c, v]) => { data.bases[c] = { compra: v.compra, venta: v.venta }; });
        data.baseFecha = hoyIso;
      }
      try {
        await setDoc(doc(db, "ajustes", "ahorro_usd"), data);
        if (delta !== 0) {
          await setDoc(doc(db, "ajustes", "mov_" + Date.now()), {
            tipo: f.modo, usd: delta, total: nuevo, fecha: f.fecha || hoyIso, nota: (f.nota || "").trim(),
            blueCompra: (state.dolares.blue || {}).compra || 0, creadoEn: Date.now(),
          });
        }
        state.saveError = "";
      } catch (err) {
        state.saveError = err.code === "permission-denied"
          ? 'Firestore no permite guardar el ahorro. Agregá la colección "ajustes" a las reglas (ver firestore.rules.example).'
          : "No se pudo guardar el ahorro: " + err.message;
      }
      state.showAhorro = false; state.animate = false; render();
    }

    // Saldo real = cobrado − gastos anotados − ajuste manual (guardado en ajustes/saldo).
    function saldoBruto() {
      const gastado = state.gastos.reduce((a, x) => a + (Number(x.monto) || 0), 0);
      return resumen(misTrabajos()).totalCobrado - gastado;
    }
    function suscribirAjuste() { /* el ajuste del saldo ahora llega por suscribirAhorro (colección "ajustes") */ }
    async function guardarSaldo(real) {
      try {
        await setDoc(doc(db, "ajustes", "saldo"), { ajuste: saldoBruto() - real, saldoDeclarado: real, actualizadoEn: Date.now() });
        state.saveError = "";
        state.showSaldo = false;
      } catch (err) {
        state.saveError = err.code === "permission-denied"
          ? 'Firestore no permite guardar el saldo. Agregá la colección "ajustes" a las reglas (ver firestore.rules.example).'
          : "No se pudo guardar el saldo: " + err.message;
        state.showSaldo = false;
      }
      state.animate = false;
      render();
    }

    function fechaDeGasto(g) {
      const f = g.fecha;
      if (f && typeof f.toDate === "function") return f.toDate();
      if (typeof f === "string" && f) return new Date(f);
      return new Date(g.creadoEn || 0);
    }
    function suscribirGastos() {
      if (unsubscribeGastos) unsubscribeGastos();
      unsubscribeGastos = onSnapshot(
        gastosCol,
        (snap) => {
          const list = [];
          snap.forEach((d) => list.push({ id: d.id, ...d.data() }));
          list.sort((a, b) => fechaDeGasto(b) - fechaDeGasto(a));
          state.gastos = list;
          state.gastosError = "";
          if (state.view === "gastos") { state.animate = false; render(); }
        },
        (err) => {
          state.gastosError = err.code === "permission-denied"
            ? 'Firestore no permite leer la colección "gastos". Actualizá las reglas (ver firestore.rules.example).'
            : err.message;
          if (state.view === "gastos") { state.animate = false; render(); }
        }
      );
    }
    async function borrarGasto(id) {
      try { await deleteDoc(doc(db, "gastos", id)); }
      catch (err) { state.saveError = "No se pudo borrar el gasto: " + err.message; }
      state.confirmDeleteGasto = null;
      state.animate = false;
      render();
    }

    setPersistence(auth, browserLocalPersistence).catch(() => {});

    onAuthStateChanged(auth, (user) => {
      state.authReady = true;
      if (user && (user.email || "").toLowerCase() !== OWNER_EMAIL) {
        state.loginError = "Esta cuenta no tiene acceso.";
        signOut(auth);
        return;
      }
      state.user = user;
      state.loggingIn = false;
      if (user) {
        state.loading = true;
        state.animate = true;
        render();
        suscribirGastos();
        suscribirAjuste();
        suscribirAhorro();
        iniciarDolar();
        if (unsubscribeTrabajos) unsubscribeTrabajos();
        unsubscribeTrabajos = onSnapshot(
          trabajosCol,
          (snap) => {
            const list = [];
            snap.forEach((d) => list.push({ id: d.id, ...d.data() }));
            list.sort((a, b) => (a.fecha < b.fecha ? 1 : a.fecha > b.fecha ? -1 : (b.creadoEn || 0) - (a.creadoEn || 0)));
            const primera = state.loading;
            state.trabajos = list;
            state.loading = false;
            state.animate = primera;
            render();
          },
          (err) => {
            state.loading = false;
            state.saveError = "No se pudo conectar con la base de datos: " + err.message;
            render();
          }
        );
      } else {
        if (unsubscribeTrabajos) { unsubscribeTrabajos(); unsubscribeTrabajos = null; }
        if (unsubscribeGastos) { unsubscribeGastos(); unsubscribeGastos = null; }
        if (unsubscribeAjuste) { unsubscribeAjuste(); unsubscribeAjuste = null; }
        if (unsubscribeAhorro) { unsubscribeAhorro(); unsubscribeAhorro = null; }
        detenerDolar();
        state.ahorro = { usd: 0 };
        state.trabajos = [];
        state.gastos = [];
        state.ajuste = 0;
        state.loading = false;
      }
      render();
    });

    async function handleLogin(email, password) {

    async function guardarTrabajo(e) {
      e.preventDefault();
      const f = state.form;
      if (!f.lugar.trim() || !f.fecha) return;
      const btn = e.submitter || document.querySelector(".submit-btn");
      const r = btn ? btn.getBoundingClientRect() : null;
      const cx = r ? r.left + r.width / 2 : innerWidth / 2;
      const cy = r ? r.top + r.height / 2 : innerHeight / 2;
      const payload = {
        fecha: f.fecha,
        lugar: f.lugar.trim(),
        facturador: f.facturador.trim(),
        monto: Number(f.monto) || 0,
        facturaEnviada: !!f.facturaEnviada,
      };
      const esNuevo = !state.editingId;
      try {
        if (esNuevo) {
          const ref = doc(trabajosCol);
          state.newId = ref.id;
          await setDoc(ref, { ...payload, persona: PERSONA, cobrado: false, creadoEn: Date.now() });
        } else {
          // No se tocan "persona" ni "cobrado" al editar (cobrado se maneja con "Ya cobré").

        state.saveError = "";
        if (esNuevo && state.view === "cal") {

          state.cal = { y: yy, m: mm - 1 };

        state.saveError = "No se pudo guardar: " + err.message;

    function misTrabajos() { return state.trabajos.filter((t) => t.persona === PERSONA); }
    function resumen(lista) {
      const totalCobrado = lista.filter((t) => t.cobrado).reduce((a, t) => a + (Number(t.monto) || 0), 0);
      const totalPorCobrar = lista.filter((t) => !t.cobrado).reduce((a, t) => a + (Number(t.monto) || 0), 0);
      const sinFacturador = lista.filter((t) => !t.facturador || !t.facturador.trim()).length;
      const sinEnviar = lista.filter((t) => !t.facturaEnviada).length;
      return { totalCobrado, totalPorCobrar, cantidad: lista.length, sinFacturador, sinEnviar };
    }

    /* =====================================================================

    function renderLogin() {
      return `
        <div class="login-wrap">

      `;
