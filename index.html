    /* ---- Plazo de cobro: se cobra entre 45 y 60 días; pasado eso, la factura se resalta ---- */
    const PLAZO_MIN = 45, PLAZO_MAX = 60;
    function diasDesde(iso) {
      if (!iso) return 0;
      const [y, m, d] = iso.split("-").map(Number), h = new Date();
      return Math.floor((new Date(h.getFullYear(), h.getMonth(), h.getDate()) - new Date(y, m - 1, d)) / 86400000);
    }
    function estadoCobro(job) {
      if (job.cobrado) return null;
      const d = diasDesde(job.fecha);
      if (d > PLAZO_MAX) return { t: "atrasada", d };
      if (d >= PLAZO_MIN) return { t: "venciendo", d, falta: PLAZO_MAX - d };
      return { t: "ok", d };
    }
    const MESES_CORTOS = ["ene", "feb", "mar", "abr", "may", "jun", "jul", "ago", "sep", "oct", "nov", "dic"];
    const corto = (n) => {
      const a = Math.abs(n);
      return a >= 1e6 ? (n / 1e6).toFixed(a >= 1e7 ? 0 : 1).replace(".", ",") + "M" : a >= 1e3 ? Math.round(n / 1e3) + "k" : String(Math.round(n));
    };

    function jobCard(job, i, cls) {
      const faltaFacturador = !job.facturador || !job.facturador.trim();
      const enviada = !!job.facturaEnviada;
      const ec = estadoCobro(job);
      const extra = `${(faltaFacturador || !enviada) ? "has-warning" : ""} ${ec && ec.t === "atrasada" ? "atrasada" : ""} ${job.id === state.newId ? "fresh" : ""} ${job.id === state.paidId ? "paid-now" : ""}`;
      const plazo = !ec ? "" : `<div class="job-meta"><span class="plazo ${ec.t}">${
        ec.t === "atrasada" ? `⚠ Atrasada: ${ec.d} días sin cobrar (pasó el plazo de ${PLAZO_MAX})`
        : ec.t === "venciendo" ? `⏳ Ya está en el plazo de cobro: faltan ${ec.falta} ${ec.falta === 1 ? "día" : "días"} para los ${PLAZO_MAX}`
        : `Hace ${ec.d} ${ec.d === 1 ? "día" : "días"} · se suele cobrar entre ${PLAZO_MIN} y ${PLAZO_MAX}`}</span></div>`;
      return `
        <div class="job ${cls} ${extra}" style="--i:${Math.min(i, 12)}">
          <div class="job-actions">
            ${state.confirmDeleteId === job.id ? `
              <div class="confirm-row">
                ¿Borrar?
                <button class="yes" data-action="confirm-borrar" data-id="${esc(job.id)}">Sí</button>
                <button class="no" data-action="cancelar-borrar">No</button>
              </div>
            ` : `
              <button class="icon-btn" data-action="editar" data-id="${esc(job.id)}" title="Editar" aria-label="Editar"><i data-lucide="pencil"></i></button>
              <button class="icon-btn danger" data-action="pedir-borrar" data-id="${esc(job.id)}" title="Borrar" aria-label="Borrar"><i data-lucide="trash-2"></i></button>
            `}
          </div>
          <div class="job-top"><span class="job-fecha">${fechaCorta(job.fecha)}</span></div>
          <div class="job-lugar-row">
            <span class="job-lugar">${esc(job.lugar)}</span>
            ${enviada
              ? `<span class="sent-pill yes" title="Factura enviada"><i data-lucide="send"></i> Enviado</span>`
              : `<span class="sent-pill no" title="Factura sin enviar">Sin enviar</span>`}
          </div>
          <div class="job-meta">
            ${faltaFacturador
              ? `<span class="tag warn"><i data-lucide="help-circle"></i> Falta definir quién factura</span>`
              : `<span class="tag">Factura: ${esc(job.facturador)}</span>`}
            <span class="tag job-monto">${money(job.monto)}</span>
          </div>
          ${plazo}
          <div class="job-meta">
            ${job.cobrado
              ? `<span class="tag ok-tag" data-action="marcar-por-cobrar" data-id="${esc(job.id)}" title="Click para deshacer"><i data-lucide="check-circle-2"></i> Cobrado</span>`
              : `<button class="cobrar-btn" data-action="marcar-cobrado" data-id="${esc(job.id)}"><i data-lucide="banknote"></i> Ya cobré</button>`}
          </div>
        </div>
      `;
    }

    function renderListView(lista) {
      const q = state.query.trim().toLowerCase();
      const f = state.filter;
      const conteo = {
        todos: lista.length,
        porcobrar: lista.filter((t) => !t.cobrado).length,
        sinenviar: lista.filter((t) => !t.facturaEnviada).length,
        cobrados: lista.filter((t) => t.cobrado).length,
        atrasadas: lista.filter((t) => (estadoCobro(t) || {}).t === "atrasada").length,
      };
      const FILTROS = [["todos", "Todos"], ["porcobrar", "Por cobrar"], ["atrasadas", "Atrasadas"], ["sinenviar", "Sin enviar"], ["cobrados", "Cobrados"]];
      const filtrada = lista.filter((t) => {
        if (f === "atrasadas" && (estadoCobro(t) || {}).t !== "atrasada") return false;
        if (f === "porcobrar" && t.cobrado) return false;
        if (f === "sinenviar" && t.facturaEnviada) return false;
        if (f === "cobrados" && !t.cobrado) return false;
        return !q || (t.lugar || "").toLowerCase().includes(q) || (t.facturador || "").toLowerCase().includes(q);
      });
      const body = filtrada.length === 0 ? `
        <div class="empty">
          <h3>${q || f !== "todos" ? "No hay resultados" : "Todavía no hay trabajos cargados"}</h3>
          <p>${q || f !== "todos" ? "Probá con otro filtro o búsqueda." : "Agregá tu primer trabajo."}</p>
          ${!q && f === "todos" ? `<button class="add-btn" data-action="nuevo"><i data-lucide="plus"></i> Agregar trabajo</button>` : ""}
        </div>
      ` : `<div class="list">${filtrada.map((job, i) => jobCard(job, i, "enter")).join("")}</div>`;
      return `
        <div class="search">
          <i data-lucide="search"></i>
          <input id="search-input" placeholder="Buscar por lugar o facturador..." value="${esc(state.query)}" autocomplete="off" />
        </div>
        <div class="filters">
          ${FILTROS.map(([id, label]) => `<button class="fchip ${f === id ? "active" : ""}" data-filter="${id}">${label} · ${conteo[id]}</button>`).join("")}
        </div>
        ${body}
      `;
    }

    function renderCalendarView(lista) {
      const { y, m } = state.cal;
      const off = (new Date(y, m, 1).getDay() + 6) % 7;
      const dim = new Date(y, m + 1, 0).getDate();
      const byDay = {};
      lista.forEach((t) => { (byDay[t.fecha] = byDay[t.fecha] || []).push(t); });
      const prefix = `${y}-${pad(m + 1)}-`;
      const delMes = lista.filter((t) => (t.fecha || "").startsWith(prefix));
      const totalMes = delMes.reduce((a, t) => a + (Number(t.monto) || 0), 0);
      const mesNombre = new Date(y, m, 1).toLocaleDateString("es-AR", { month: "long", year: "numeric" });

      let cells = ["Lun", "Mar", "Mié", "Jue", "Vie", "Sáb", "Dom"].map((d) => `<div class="cal-dow">${d}</div>`).join("");
      for (let i = 0; i < off; i++) cells += `<div class="cal-day blank"></div>`;
      for (let d = 1; d <= dim; d++) {
        const iso = isoDay(y, m, d);
        const jobs = byDay[iso] || [];
        const dots = jobs.slice(0, 6).map((j, k) => {
          const c = j.cobrado ? "paid" : j.facturaEnviada ? "sent" : "unsent";
          return `<span class="dot ${c}" style="--i:${k}"></span>`;
        }).join("") + (jobs.length > 6 ? `<span class="more">+${jobs.length - 6}</span>` : "");
        cells += `<button class="cal-day enter ${jobs.length ? "has" : ""} ${iso === hoyIso ? "today" : ""} ${iso === state.selDay ? "sel" : ""}" style="--i:${Math.min(Math.floor((off + d) / 7) * 2, 10)}" data-day="${iso}" aria-label="${fechaLarga(iso)}"><span class="n">${d}</span><span class="dots">${dots}</span></button>`;
      }

      const sel = state.selDay;
      const panelJobs = sel ? (byDay[sel] || []) : delMes;
      const panelTitle = sel ? fechaLarga(sel) : `Trabajos de ${new Date(y, m, 1).toLocaleDateString("es-AR", { month: "long" })}`;
      const panelBody = panelJobs.length
        ? `<div class="list">${panelJobs.map((j, i) => jobCard(j, i, "pop")).join("")}</div>`
        : `<div class="empty"><h3>${sel ? "Sin trabajos este día" : "Sin trabajos este mes"}</h3><p>Tocá "Agregar" para cargar uno.</p></div>`;
      const slide = state.calDir > 0 ? "slide-next" : state.calDir < 0 ? "slide-prev" : "";

      return `
        <div class="cal">
          <div class="cal-head">
            <div class="cal-title">
              <h2>${mesNombre}</h2>
              <p>${delMes.length} ${delMes.length === 1 ? "trabajo" : "trabajos"} · ${money(totalMes)}</p>
            </div>
            <div class="cal-nav">
              <button data-action="cal-prev" aria-label="Mes anterior"><i data-lucide="chevron-left"></i></button>
              <button data-action="cal-hoy">Hoy</button>
              <button data-action="cal-next" aria-label="Mes siguiente"><i data-lucide="chevron-right"></i></button>
            </div>
          </div>
          <div class="cal-grid ${slide}">${cells}</div>
          <div class="legend">
            <span><i class="dot paid"></i> Cobrado</span>
            <span><i class="dot sent"></i> Enviado</span>
            <span><i class="dot unsent"></i> Sin enviar</span>
          </div>
        </div>
        <div class="day-panel">
          <div class="day-head">
            <h3>${panelTitle}</h3>
            <button class="add-btn" data-action="nuevo-dia" data-day="${sel || (delMes.length ? "" : isoDay(y, m, 1))}"><i data-lucide="plus"></i> Agregar</button>
          </div>
          ${panelBody}
        </div>
      `;
    }

    const COLORES_TORTA = ["#ff9a1f", "#7fc7ff", "#4fd699", "#b58bff", "#ff6a55", "#ffd24a", "#5eead4", "#f472b6"];
    function donutGastos(cats, total) {
      const R = 62, C = 2 * Math.PI * R, GAP = 3;
      let acum = 0;
      const arcos = cats.map(([k, v], i) => {
        const frac = v / total, len = Math.max(0, frac * C - GAP);
        const off = -acum * C; acum += frac;
        return `<circle class="arc" cx="80" cy="80" r="${R}" fill="none" stroke="${COLORES_TORTA[i % COLORES_TORTA.length]}" stroke-width="20"
          stroke-dasharray="${len.toFixed(2)} ${(C - len).toFixed(2)}" stroke-dashoffset="${off.toFixed(2)}" style="--C:${C.toFixed(2)};--i:${i}" transform="rotate(-90 80 80)"><title>${esc(k)}: ${money(v)}</title></circle>`;
      }).join("");
      const leyenda = cats.map(([k, v], i) => `
        <div class="leg-row"><i style="background:${COLORES_TORTA[i % COLORES_TORTA.length]}"></i><span class="nm">${esc(k)}</span>
          <span class="pc">${(v / total * 100).toFixed(0)}%</span><span class="mt">${money(v)}</span></div>`).join("");
      return `<div class="donut-wrap">
        <svg class="donut" viewBox="0 0 160 160" role="img" aria-label="Gastos por categoría">
          <circle cx="80" cy="80" r="${R}" fill="none" stroke="rgba(255,255,255,.06)" stroke-width="20"/>${arcos}
          <text x="80" y="76" text-anchor="middle" class="dn-l">TOTAL</text><text x="80" y="95" text-anchor="middle" class="dn-v">${corto(total)}</text>
        </svg><div class="legend-col">${leyenda}</div></div>`;
    }

    function renderResumenView(lista) {
      // Cobros por mes (según la fecha del trabajo): lo cobrado + lo que falta cobrar, últimos 12 meses.
      const meses = [];
      for (let i = 11; i >= 0; i--) {
        const d = new Date(hoy.getFullYear(), hoy.getMonth() - i, 1);
        meses.push({ y: d.getFullYear(), m: d.getMonth(), k: `${d.getFullYear()}-${pad(d.getMonth() + 1)}`, cob: 0, pend: 0, n: 0 });
      }
      lista.forEach((t) => {
        const mm = meses.find((x) => (t.fecha || "").startsWith(x.k));
        if (!mm) return;
        mm.n++;
        if (t.cobrado) mm.cob += Number(t.monto) || 0; else mm.pend += Number(t.monto) || 0;
      });
      const max = Math.max(1, ...meses.map((x) => x.cob + x.pend));
      const conDatos = meses.filter((x) => x.cob + x.pend > 0);
      const totalCob = meses.reduce((a, x) => a + x.cob, 0), totalPend = meses.reduce((a, x) => a + x.pend, 0);
      const mejor = conDatos.slice().sort((a, b) => (b.cob + b.pend) - (a.cob + a.pend))[0];
      const prom = conDatos.length ? (totalCob + totalPend) / conDatos.length : 0;
      const nomMes = (x) => new Date(x.y, x.m, 1).toLocaleDateString("es-AR", { month: "long", year: "numeric" });
      const barras = meses.map((x, i) => {
        const tot = x.cob + x.pend, h = tot ? Math.max(4, (tot / max) * 100) : 0;
        return `<div class="bar-col" style="--i:${i}" title="${esc(nomMes(x))}: cobrado ${money(x.cob)} · por cobrar ${money(x.pend)}">
          <div class="bar-val">${tot ? corto(tot) : ""}</div>
          <div class="bar-area"><div class="bar-stack" style="height:${h}%">
            ${x.pend ? `<i class="pend" style="flex-grow:${x.pend}"></i>` : ""}${x.cob ? `<i class="cob" style="flex-grow:${x.cob}"></i>` : ""}</div></div>
          <div class="bar-lbl">${MESES_CORTOS[x.m]}</div></div>`;
      }).join("");
      const atras = lista.filter((t) => (estadoCobro(t) || {}).t === "atrasada");
      const montoAtras = atras.reduce((a, t) => a + (Number(t.monto) || 0), 0);
      return `
        <div class="gcards">
          <div class="gcard enter" style="--i:0"><div class="lbl">Mejor mes</div><div class="big" style="font-size:19px">${mejor ? esc(nomMes(mejor)) : "—"}</div><div class="ghint">${mejor ? money(mejor.cob + mejor.pend) + " en " + mejor.n + (mejor.n === 1 ? " trabajo" : " trabajos") : "Sin datos todavía"}</div></div>
          <div class="gcard enter" style="--i:1"><div class="lbl">Promedio por mes</div><div class="big" data-count="${Math.round(prom)}" data-key="r-prom">${money(prom)}</div><div class="ghint">en los meses con trabajos</div></div>
          <div class="gcard enter ${atras.length ? "neg" : ""}" style="--i:2"><div class="lbl">Atrasado de cobro</div><div class="big">${money(montoAtras)}</div><div class="ghint">${atras.length ? atras.length + (atras.length === 1 ? " factura pasó" : " facturas pasaron") + " los " + PLAZO_MAX + " días" : "Nada atrasado"}</div></div>
        </div>
        <div class="chartcard enter" style="--i:3">
          <div class="chart-head"><h3>Cobros por mes</h3>
            <div class="legend-inline"><span><i class="cob"></i> Cobrado</span><span><i class="pend"></i> Por cobrar</span></div></div>
          <div class="bars">${barras}</div>
          <div class="ghint" style="margin-top:8px">Los trabajos se ubican en el mes de su fecha. Pasá el mouse o tocá una barra para ver el detalle.</div>
        </div>`;
    }

    function renderGastosView() {
      if (state.gastosError) {
        return `<div class="empty"><h3>No se pueden leer los gastos</h3><p>${esc(state.gastosError)}</p></div>`;
      }
      const g = state.gastos;
      const total = g.reduce((a, x) => a + (Number(x.monto) || 0), 0);
      const mes = hoyIso.slice(0, 7);
      const delMes = g.filter((x) => { const d = fechaDeGasto(x); return isoDay(d.getFullYear(), d.getMonth(), d.getDate()).startsWith(mes); });
      const totalMes = delMes.reduce((a, x) => a + (Number(x.monto) || 0), 0);
      const balance = resumen(misTrabajos()).totalCobrado - total - state.ajuste;
      const cap = (s) => { s = String(s || "Sin categoría").trim() || "Sin categoría"; return s.charAt(0).toUpperCase() + s.slice(1).toLowerCase(); };

      const porCat = {};
      g.forEach((x) => { const k = cap(x.categoria); porCat[k] = (porCat[k] || 0) + (Number(x.monto) || 0); });
      const cats = Object.entries(porCat).sort((a, b) => b[1] - a[1]);
      const max = cats.length ? cats[0][1] : 1;

      const fmtFecha = (x) => fechaDeGasto(x).toLocaleString("es-AR", { day: "2-digit", month: "2-digit", year: "numeric", hour: "2-digit", minute: "2-digit" });
      const lista = g.length === 0
        ? `<div class="empty"><h3>Todavía no hay gastos</h3><p>Los gastos que cargues desde el widget del celular aparecen acá al instante.</p></div>`
        : `<div class="list">${g.map((x, i) => `
            <div class="gasto enter" style="--i:${Math.min(i, 12)}">
              <div class="gi">
                <span class="gcat">${esc(cap(x.categoria))}</span>
                ${x.descripcion ? `<div class="gdesc">${esc(x.descripcion)}</div>` : ""}
                <div class="gdate">${fmtFecha(x)}</div>
              </div>
              <div class="gmonto">${money(x.monto)}</div>
              <div class="gdel">
                ${state.confirmDeleteGasto === x.id ? `
                  <div class="confirm-row">¿Borrar?
                    <button class="yes" data-action="confirm-borrar-gasto" data-id="${esc(x.id)}">Sí</button>
                    <button class="no" data-action="cancelar-borrar-gasto">No</button>
                  </div>` : `<button class="icon-btn danger" data-action="pedir-borrar-gasto" data-id="${esc(x.id)}" title="Borrar" aria-label="Borrar gasto"><i data-lucide="trash-2"></i></button>`}
              </div>
            </div>`).join("")}</div>`;

      return `
        <div class="gcards">
          <div class="gcard enter" style="--i:0"><div class="lbl">Total gastado</div><div class="big" style="color:var(--warn)" data-count="${total}" data-key="g-total">${money(total)}</div></div>
          <div class="gcard enter" style="--i:1"><div class="lbl">Este mes</div><div class="big" data-count="${totalMes}" data-key="g-mes">${money(totalMes)}</div></div>
          <div class="gcard enter ${balance >= 0 ? "pos" : "neg"}" style="--i:2"><button class="icon-btn edit" data-action="editar-saldo" title="Editar saldo" aria-label="Editar saldo"><i data-lucide="pencil"></i></button><div class="lbl">Saldo real · lo que te queda</div><div class="big" data-count="${balance}" data-key="g-bal">${money(balance)}</div>${state.ajuste ? `<div class="ghint">Incluye un ajuste manual de ${state.ajuste > 0 ? "−" : "+"} ${money(Math.abs(state.ajuste))}</div>` : ""}</div>
        </div>
        ${cats.length ? `<div class="cats enter" style="--i:3"><h3>En qué se va la plata</h3>${donutGastos(cats, total)}</div>` : ""}
        <div class="gasto-list-title">Egresos registrados · ${g.length}</div>
        ${lista}
      `;
    }

    function chartSvg(serie, dibujar, modo) {
      const tipo = state.tipoCot;
      let pts, vals;
      if (modo === "usd") {
        pts = serieUsd(); vals = pts.map((p) => p.v); state.chartFmt = "usd";
      } else {
        const mult = modo === "ahorro" ? (Number(state.ahorro.usd) || 0) : 1;
        const d = new Date(); d.setDate(d.getDate() - state.rango);
        const desde = isoDay(d.getFullYear(), d.getMonth(), d.getDate());
        pts = serie.filter((p) => p.fecha >= desde);
        if (pts.length < 2) pts = serie.slice(-2);
        vals = pts.map((p) => p[tipo] * mult); state.chartFmt = "ars";
      }
      if (pts.length < 2) { state.chartPts = []; return `<div class="empty" style="padding:30px 10px"><p style="margin:0">Cargá al menos un movimiento de dólares para ver cómo crece tu ahorro.</p></div>`; }
      const min = Math.min(...vals), max = Math.max(...vals);
      const pad = (max - min) * 0.14 || max * 0.02, lo = min - pad, hi = max + pad;
      const L = 8, R = 8, T = 14, B = 24;
      const t0 = Date.parse(pts[0].fecha + "T12:00:00"), t1 = Date.parse(pts[pts.length - 1].fecha + "T12:00:00");
      const X = (f) => L + ((Date.parse(f + "T12:00:00") - t0) / Math.max(1, t1 - t0)) * (CH_W - L - R);
      const Y = (v) => T + (1 - (v - lo) / (hi - lo)) * (CH_H - T - B);
      state.chartPts = pts.map((p, i) => ({ x: X(p.fecha), y: Y(vals[i]), fecha: p.fecha, v: vals[i] }));
      const line = state.chartPts.map((p, i) => (i ? "L" : "M") + p.x.toFixed(1) + " " + p.y.toFixed(1)).join(" ");
      const first = state.chartPts[0], last = state.chartPts[state.chartPts.length - 1];
      const area = `${line} L${last.x.toFixed(1)} ${CH_H - B} L${first.x.toFixed(1)} ${CH_H - B} Z`;
      const grid = [0, 1, 2, 3].map((i) => {
        const v = lo + ((hi - lo) * (3 - i)) / 3, y = T + ((CH_H - T - B) * i) / 3;
        return `<line class="dgrid" x1="${L}" x2="${CH_W - R}" y1="${y}" y2="${y}"/><text class="dlbl" x="${L + 2}" y="${y - 4}">${state.chartFmt === "usd" ? usd(v) : money(v)}</text>`;
      }).join("");
      const cd = (f) => { const [, m, dd] = f.split("-"); return `${dd}/${m}`; };
      const mid = state.chartPts[Math.floor(state.chartPts.length / 2)];
      const dr = dibujar ? "draw" : "";
      return `
        <svg id="dchart" viewBox="0 0 ${CH_W} ${CH_H}" role="img" aria-label="Gráfico del dólar blue">
          <defs><linearGradient id="dgrad" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4fd699" stop-opacity=".42"/><stop offset="1" stop-color="#4fd699" stop-opacity="0"/></linearGradient></defs>
          ${grid}
          <path class="darea ${dr}" d="${area}" fill="url(#dgrad)"/>
          <path class="dline ${dr}" pathLength="1" d="${line}"/>
          <text class="dlbl" x="${L}" y="${CH_H - 6}">${cd(first.fecha)}</text>
          <text class="dlbl" x="${mid.x}" y="${CH_H - 6}" text-anchor="middle">${cd(mid.fecha)}</text>
          <text class="dlbl" x="${CH_W - R}" y="${CH_H - 6}" text-anchor="end">${cd(last.fecha)}</text>
          <circle class="dlive-ring" cx="${last.x}" cy="${last.y}" r="5"/>
          <circle class="dlive" cx="${last.x}" cy="${last.y}" r="4.5"/>
          <line id="dcl" class="dcl" x1="0" x2="0" y1="${T}" y2="${CH_H - B}" opacity="0"/>
          <circle id="dcc" class="dcc" r="5" cx="0" cy="0" opacity="0"/>
        </svg>
        <div id="dtip" class="dtip"></div>`;
    }

    function renderDolaresView() {
      const tipo = state.tipoCot, serie = serieDolar();
      const ult = serie[serie.length - 1];
      const cur = state.dolares[state.casa] || null, nombre = nombreCasa(state.casa);
      const ahora = cur ? cur[tipo] : (ult ? ult[tipo] : 0);
      const a = state.ahorro, u = Number(a.usd) || 0, pesosAhorro = u * ahora;
      const base = Number(a.bases && a.bases[state.casa] ? a.bases[state.casa][tipo] : 0) || 0;
      const dArs = base ? u * (ahora - base) : 0, dPct = base ? (ahora / base - 1) * 100 : 0;
      const signo = (n) => (n >= 0 ? "+" : "−") + " " + money(Math.abs(n));
      const flecha = (n) => (n >= 0 ? "▲" : "▼");
      const cls = (n) => (n >= 0 ? "up" : "down");
      const dibujar = state.drawAnim; state.drawAnim = false;
      const hora = cur ? new Date(cur.leido).toLocaleTimeString("es-AR") : "—";
      let modo = state.chartModo;
      if (modo === "ahorro" && !(u > 0)) modo = "cot";
      if (modo === "usd" && !state.movs.length) modo = "cot";

      // Cartel "subió / bajó el dólar" (hoy vs ayer)
      const ayer = valorHace(serie, 1, tipo), pAyer = ayer && ahora ? (ahora / ayer - 1) * 100 : 0;
      const dif = u * (ahora - (ayer || ahora));
      const banner = !ayer || !ahora ? "" : Math.abs(pAyer) < 0.05
        ? `<div class="banner flat enter" style="--i:0">El dólar ${nombre} no tuvo cambios hoy: sigue en ${money(ahora)}.</div>`
        : `<div class="banner ${pAyer > 0 ? "up" : "down"} enter" style="--i:0"><span class="bi">${pAyer > 0 ? "▲" : "▼"}</span>
            <div><b>${pAyer > 0 ? "Subió" : "Bajó"} el dólar ${nombre} ${fmtPct(pAyer)}</b> respecto de ayer (${money(ayer)} → ${money(ahora)}).
            ${u ? `<br>Tus ${usd(u)} ${pAyer > 0 ? "valen" : "ahora valen"} <b>${money(Math.abs(dif))} ${pAyer > 0 ? "más" : "menos"}</b> que ayer.` : ""}</div></div>`;

      // Simulador de venta: cuántos pesos te dan por tus dólares en cada tipo de dólar
      const sim = state.simUsd != null ? state.simUsd : (u > 0 ? u : 100);
      const al = state.alerta, nomAl = nombreCasa(al.casa);

      const cambios = [["Hoy vs ayer", 1], ["Últimos 7 días", 7], ["Últimos 30 días", 30]].map(([lbl, dias], i) => {
        const prev = valorHace(serie, dias, tipo);
        if (!prev || !ahora) return `<div class="gcard enter" style="--i:${i}"><div class="lbl">${lbl}</div><div class="big">—</div></div>`;
        const p = (ahora / prev - 1) * 100, ars = u * (ahora - prev);
        return `<div class="gcard enter" style="--i:${i}"><div class="lbl">${lbl}</div>
          <div class="big delta ${cls(p)}">${flecha(p)} ${fmtPct(p)}</div>
          <div class="ghint">${u ? `Tu ahorro: ${signo(ars)}` : `Dólar: ${signo(ahora - prev)}`}</div></div>`;
      }).join("");

      return `
        <div class="dhero enter" style="--i:0">
          <button class="icon-btn edit" data-action="editar-ahorro" title="Editar ahorro" aria-label="Editar ahorro"><i data-lucide="pencil"></i></button>
          <div class="lbl">Mi ahorro en dólares</div>
          ${u > 0 ? `
            <div class="usd" data-count="${u}" data-key="d-usd" data-fmt="usd">${usd(u)}</div>
            <div class="ars"><small>EN PESOS</small><span data-count="${pesosAhorro}" data-key="d-ars">${money(pesosAhorro)}</span></div>
            <div class="sub">Valuado al dólar <b>${nombre} ${tipo}</b> de ${money(ahora)}${tipo === "compra" ? " · lo que te pagarían hoy por venderlos" : " · lo que costaría comprarlos hoy"}</div>
            ${base ? `<div class="sub varline">Desde que lo cargaste${a.baseFecha ? ` (${fechaCorta(a.baseFecha)})` : ""}: <span class="delta ${cls(dArs)}">${flecha(dArs)} ${signo(dArs)} (${fmtPct(dPct)})</span></div>` : ""}
          ` : `
            <div class="usd" style="font-size:24px;color:var(--text-dim)">Todavía no cargaste dólares</div>
            <div class="sub">Cargá cuántos dólares tenés y te muestro cuánto valen hoy en pesos y si subieron o bajaron.</div>
            <button class="add-btn" style="margin-top:12px;padding:10px 16px" data-action="editar-ahorro"><i data-lucide="plus"></i> Cargar mis dólares</button>
          `}
          <div class="live" style="margin-top:12px"><span class="sync-dot"></span> En vivo · actualizado ${hora}${cur ? ` · ${nombre}: compra ${money(cur.compra)} / venta ${money(cur.venta)}` : ""}</div>
        </div>
        ${banner}
        ${state.dolarError ? `<div class="save-error">${esc(state.dolarError)}</div>` : ""}
        <div class="filters enter" style="--i:1">
          ${CASAS.map(([id, nom]) => `<button class="fchip ${state.casa === id ? "active" : ""}" data-casa="${id}">${nom}</button>`).join("")}
        </div>
        <div class="ghint" style="margin:-6px 0 10px"><b>${nombre}:</b> ${esc((CASAS.find((c) => c[0] === state.casa) || [])[2] || "")}</div>
        <div class="filters enter" style="--i:1">
          <button class="fchip ${tipo === "compra" ? "active" : ""}" data-tipo="compra">Valuar a compra</button>
          <button class="fchip ${tipo === "venta" ? "active" : ""}" data-tipo="venta">Valuar a venta</button>
        </div>
        <div class="gcards">${cambios}</div>
        <div class="chartcard enter" style="--i:3">
          <div class="chart-head">
            <h3>${modo === "ahorro" ? "Mi ahorro en pesos" : modo === "usd" ? "Cómo crecen mis dólares" : "Dólar " + nombre + " (" + tipo + ")"}</h3>
            ${modo === "usd" ? "" : `<div class="filters" style="margin:0">
              ${[[7, "1S"], [30, "1M"], [90, "3M"], [180, "6M"], [365, "1A"]].map(([d, l]) => `<button class="fchip ${state.rango === d ? "active" : ""}" data-rango="${d}">${l}</button>`).join("")}
            </div>`}
          </div>
          ${u > 0 || state.movs.length ? `<div class="filters" style="margin-bottom:6px">
            <button class="fchip ${modo === "cot" ? "active" : ""}" data-modo="cot">Cotización</button>
            ${u > 0 ? `<button class="fchip ${modo === "ahorro" ? "active" : ""}" data-modo="ahorro">Mi ahorro en $</button>` : ""}
            ${state.movs.length ? `<button class="fchip ${modo === "usd" ? "active" : ""}" data-modo="usd">Mis dólares (historial)</button>` : ""}</div>` : ""}
          <div class="chart-wrap">${state.histCasa[state.casa] ? chartSvg(serie, dibujar, modo) : `<div class="loading-wrap"><i data-lucide="loader-2" class="spin"></i> Cargando cotización...</div>`}</div>
          <div class="ghint" style="margin-top:8px">Fuente: dolarapi.com y argentinadatos.com. Se actualiza cada minuto; el último punto del gráfico es el valor de ahora.</div>
        </div>

        <div class="chartcard enter" style="--i:4">
          <div class="chart-head"><h3>Simulador de venta</h3></div>
          <div class="field" style="margin-bottom:10px">
            <label for="sim-usd">Si vendo estos dólares hoy…</label>
            <div class="amount-prefix"><span>US$</span><input type="number" id="sim-usd" min="0" step="1" value="${esc(sim)}" /></div>
          </div>
          <div id="sim-body">${simHtml(sim)}</div>
          <div class="ghint" style="margin-top:8px">Se usa el precio de compra (lo que te pagan). Blue y oficial son venta de billete; MEP, CCL y cripto se operan con bonos o apps, y suelen tener costos o demoras.</div>
        </div>

        <div class="chartcard enter" style="--i:5">
          <div class="chart-head"><h3>Alertas del dólar</h3>
            <button class="fchip ${al.activa ? "active" : ""}" data-alerta="toggle">${al.activa ? "Activadas" : "Desactivadas"}</button></div>
          <div class="ghint" style="margin:0 0 8px">Te aviso en el celular y acá cuando el dólar <b>${nomAl} (${al.tipo})</b> cambie más de:</div>
          <div class="filters">${[0.5, 1, 2, 3].map((p) => `<button class="fchip ${Number(al.umbralPct) === p ? "active" : ""}" data-umbral="${p}">${String(p).replace(".", ",")} %</button>`).join("")}</div>
          <div class="filters" style="margin-bottom:0">
            <button class="fchip" data-alerta="actual">Usar el que estoy viendo (${nombre} ${tipo})</button>
            <button class="fchip" data-alerta="notif">${"Notification" in window && Notification.permission === "granted" ? "Avisos del navegador: sí" : "Activar avisos del navegador"}</button>
          </div>
        </div>

        ${state.movs.length ? `<div class="chartcard enter" style="--i:6">
          <div class="chart-head"><h3>Mis movimientos de dólares</h3></div>
          ${state.movs.slice().reverse().slice(0, 10).map((m) => `<div class="mov-row">
            <span class="mf">${fechaCorta(m.fecha)}</span>
            <span class="delta ${Number(m.usd) >= 0 ? "up" : "down"}">${Number(m.usd) >= 0 ? "+" : "−"} ${usd(Math.abs(m.usd))}</span>
            <span class="mn">${esc(m.nota || (m.tipo === "corregir" ? "Corrección del total" : m.tipo === "retirar" ? "Retiro" : "Ingreso"))}</span>
            <span class="mt">${usd(m.total)}</span></div>`).join("")}
        </div>` : ""}
      `;
    }

    function simHtml(cant) {
      const n = Number(cant) || 0;
      const filas = ["blue", "oficial", "bolsa", "contadoconliqui", "cripto"]
        .map((c) => ({ c, tasa: (state.dolares[c] || {}).compra || 0 }))
        .filter((x) => x.tasa)
        .map((x) => ({ ...x, pesos: n * x.tasa }))
        .sort((a, b) => b.pesos - a.pesos);
      if (!filas.length) return `<div class="ghint">Cargando cotizaciones…</div>`;
      const blue = (filas.find((x) => x.c === "blue") || {}).pesos || 0;
      return filas.map((x, i) => {
        const d = x.pesos - blue;
        return `<div class="sim-row ${i === 0 ? "best" : ""}"><span class="nm">${esc(nombreCasa(x.c))}${i === 0 ? ' <em>mejor</em>' : ""}</span>
          <span class="tasa">${money(x.tasa)}</span><span class="pe">${money(x.pesos)}</span>
          <span class="df delta ${d >= 0 ? "up" : "down"}">${x.c === "blue" ? "" : (d >= 0 ? "+" : "−") + money(Math.abs(d))}</span></div>`;
      }).join("");
    }

    function renderAhorroModal() {
      const a = state.ahorro, m = state.ahorroModo, u = Number(a.usd) || 0;
      const pregunta = m === "sumar" ? "¿Cuántos dólares sumaste?" : m === "retirar" ? "¿Cuántos dólares sacaste?" : "¿Cuántos dólares tenés en total?";
      return `
        <div class="overlay" id="overlay-ahorro">
          <div class="modal" role="dialog" aria-modal="true">
            <div class="modal-head">
              <h2>Mis dólares</h2>
              <button data-action="cerrar-ahorro" aria-label="Cerrar"><i data-lucide="x"></i></button>
            </div>
            <div class="ghint" style="margin:-8px 0 10px">Ahora tenés <b>${usd(u)}</b>. Cada cambio queda guardado en tu historial.</div>
            <div class="filters" style="margin-bottom:12px">
              ${[["sumar", "Sumar"], ["retirar", "Retirar"], ["corregir", "Corregir total"]].map(([id, l]) => `<button type="button" class="fchip ${m === id ? "active" : ""}" data-mov="${id}">${l}</button>`).join("")}
            </div>
            <form id="ahorro-form">
              <div class="field">
                <label for="f-ahorro">${pregunta}</label>
                <div class="amount-prefix">
                  <span>US$</span>
                  <input type="number" id="f-ahorro" step="0.01" min="0" required value="${esc(state.ahorroInput)}" />
                </div>
                ${u === 0 ? `<div class="hint">La primera vez, usá "Sumar" con todos los dólares que ya tenés.</div>` : ""}
              </div>
              <div class="field">
                <label for="f-ahorro-fecha">Fecha</label>
                <input type="date" id="f-ahorro-fecha" required value="${esc(state.ahorroFecha || hoyIso)}" />
              </div>
              <div class="field">
                <label for="f-ahorro-nota">Nota (opcional)</label>
                <input type="text" id="f-ahorro-nota" placeholder="Ej: cambié pesos a dólares" value="${esc(state.ahorroNota)}" />
              </div>
              <button type="submit" class="submit-btn">Guardar</button>
              ${a.bases && Object.keys(a.bases).length ? `<button type="button" class="fchip" style="width:100%;margin-top:10px;padding:10px" data-action="reiniciar-base">Guardar y reiniciar la comparación con el dólar de hoy</button>` : ""}
            </form>
          </div>
        </div>`;
    }

    function renderApp() {
      const lista = misTrabajos();
      const r = resumen(lista);
      const total = r.totalCobrado + r.totalPorCobrar;
      const pct = total > 0 ? Math.round((r.totalCobrado / total) * 100) : 0;

      const st = () => `style="--i:${idx++}"`;

        <div class="header">
          <div class="header-inner">

            <div class="title-block">
              <h1>Trabajos de Iluminación</h1>
              <p>Registro de trabajos y facturación</p>

            <div class="sync-info"><span class="sync-dot"></span> En vivo</div>

          </div>
        </div>
        <div class="content">
          ${state.loading ? `
            <div class="loading-wrap"><i data-lucide="loader-2" class="spin"></i> Cargando trabajos...</div>
          ` : `
            <div class="hero">
              <button class="money-card ok enter" ${st()} data-goto="cobrados">

                <div class="big" data-count="${r.totalCobrado}" data-key="cobrado">${money(r.totalCobrado)}</div>
              </button>
              <button class="money-card pend enter" ${st()} data-goto="porcobrar">
                <div class="lbl"><i data-lucide="hourglass"></i> Por cobrar</div>
                <div class="big" data-count="${r.totalPorCobrar}" data-key="porcobrar">${money(r.totalPorCobrar)}</div>
              </button>
            </div>
            <div class="progress enter" ${st()}>
              <div class="progress-top"><span>Progreso de cobro</span><span>${pct}%</span></div>
              <div class="progress-track"><div class="progress-fill" style="--p:${pct}%"></div></div>
            </div>
            <div class="chips enter" ${st()}>
              <span class="chip"><i data-lucide="briefcase" style="width:13px;height:13px"></i> Trabajos <b>${r.cantidad}</b></span>
              <span class="chip ${r.sinFacturador > 0 ? "warn" : ""}">Sin facturador <b>${r.sinFacturador}</b></span>
              <span class="chip ${r.sinEnviar > 0 ? "warn" : ""}" ${r.sinEnviar > 0 ? `data-goto="sinenviar"` : ""}>Sin enviar <b>${r.sinEnviar}</b></span>
              <span class="chip ${atrasadas > 0 ? "warn" : ""}" ${atrasadas > 0 ? `data-goto="atrasadas"` : ""}>Atrasadas <b>${atrasadas}</b></span>
            </div>
            <div class="seg enter" ${st()} data-view="${state.view}">
              <span class="thumb ${state.viewChanged ? "slide" : ""}" style="--from:${({ list: 0, cal: 100, gastos: 200, dolares: 300, resumen: 400 })[state.prevView] ?? 0}%"></span>
              <button class="${state.view === "list" ? "active" : ""}" data-view="list"><i data-lucide="layout-list"></i> Lista</button>
              <button class="${state.view === "cal" ? "active" : ""}" data-view="cal"><i data-lucide="calendar-days"></i> Calendario</button>
              <button class="${state.view === "gastos" ? "active" : ""}" data-view="gastos"><i data-lucide="wallet"></i> Gastos</button>
              <button class="${state.view === "dolares" ? "active" : ""}" data-view="dolares"><i data-lucide="trending-up"></i> Dólares</button>
              <button class="${state.view === "resumen" ? "active" : ""}" data-view="resumen"><i data-lucide="bar-chart-3"></i> Resumen</button>
            </div>
            ${state.saveError ? `<div class="save-error">${esc(state.saveError)}</div>` : ""}
            ${state.view === "cal" ? renderCalendarView(lista) : state.view === "gastos" ? renderGastosView() : state.view === "dolares" ? renderDolaresView() : state.view === "resumen" ? renderResumenView(lista) : renderListView(lista)}
          `}
        </div>
        ${state.loading || ["gastos", "dolares", "resumen"].includes(state.view) ? "" : `<button class="fab" data-action="nuevo" aria-label="Agregar trabajo" title="Agregar trabajo"><i data-lucide="plus"></i></button>`}
        ${state.showForm ? renderModal() : ""}
        ${state.showSaldo ? renderSaldoModal() : ""}
        ${state.showAhorro ? renderAhorroModal() : ""}

    }

    function renderSaldoModal() {
      return `
        <div class="overlay" id="overlay-saldo">
          <div class="modal" role="dialog" aria-modal="true">
            <div class="modal-head">
              <h2>Editar saldo real</h2>
              <button data-action="cerrar-saldo" aria-label="Cerrar"><i data-lucide="x"></i></button>
            </div>
            <form id="saldo-form">
              <div class="field">
                <label for="f-saldo">¿Cuánto te queda realmente?</label>
                <div class="amount-prefix">
                  <span>$</span>
                  <input type="number" id="f-saldo" step="1" required value="${esc(state.saldoInput)}" />
                </div>
                <div class="hint">La diferencia con (cobrado − gastos anotados) se guarda como ajuste. Los gastos y cobros nuevos siguen sumando o restando desde este número. Podés cambiarlo cuando quieras.</div>
              </div>
              <button type="submit" class="submit-btn">Guardar saldo</button>
              ${state.ajuste ? `<button type="button" class="fchip" style="width:100%;margin-top:10px;padding:10px" data-action="restablecer-saldo">Quitar el ajuste manual</button>` : ""}
            </form>
          </div>
        </div>

    function renderModal() {
      const f = state.form;
      return `
        <div class="overlay" id="overlay">
          <div class="modal" id="modal-box" role="dialog" aria-modal="true">
            <div class="modal-head">
              <h2>${state.editingId ? "Editar trabajo" : "Nuevo trabajo"}</h2>

            </div>

              <div class="field">
                <label for="f-fecha">Fecha</label>
                <input type="date" id="f-fecha" required value="${esc(f.fecha)}" />
              </div>

                <label for="f-lugar">Lugar</label>
                <input type="text" id="f-lugar" required placeholder="Ej: Club Niceto" value="${esc(f.lugar)}" />
              </div>
              <div class="field">
                <label for="f-facturador">Quién lo factura</label>
                <input type="text" id="f-facturador" placeholder="Nombre de quién hace la factura" value="${esc(f.facturador)}" />
                <div class="hint">Si lo dejás vacío, va a quedar marcado como pendiente.</div>

              <div class="field">
                <label for="f-monto">Cuánto cobró</label>

                  <span>$</span>

              </div>
              <div class="field">
                <label>¿Mandó la factura?</label>
                <div class="bool-select">

                  <button type="button" class="${!f.facturaEnviada ? "sel no" : ""}" data-bool="false">Todavía no</button>
                </div>
              </div>
              <button type="submit" class="submit-btn">${state.editingId ? "Guardar cambios" : "Agregar trabajo"}</button>
            </form>
          </div>
        </div>
      `;
    }

    function cambiarMes(delta) {
      let { y, m } = state.cal;
      m += delta;
      if (m < 0) { m = 11; y--; } else if (m > 11) { m = 0; y++; }
      state.cal = { y, m };
      state.calDir = delta;
      state.selDay = null;
      state.animate = false;
      render();
    }

    function attachListeners() {
      const appEl = document.getElementById("app");
      const centro = (el) => { const r = el.getBoundingClientRect(); return [r.left + r.width / 2, r.top + r.height / 2]; };
      const on = (sel, fn) => appEl.querySelectorAll(sel).forEach((b) => b.addEventListener("click", () => fn(b)));

      const loginForm = document.getElementById("login-form");
      if (loginForm) {
        loginForm.addEventListener("submit", (e) => {
          e.preventDefault();
          handleLogin(document.getElementById("login-email").value.trim(), document.getElementById("login-password").value);
        });
      }

      const searchInput = document.getElementById("search-input");
      if (searchInput) {
        searchInput.addEventListener("input", (e) => {
          state.query = e.target.value;
          state.animate = false;
          render();
          const el = document.getElementById("search-input");
          if (el) { el.focus(); el.selectionStart = el.selectionEnd = el.value.length; }
        });
      }

      on(".seg button[data-view]", (b) => {
        if (b.dataset.view === state.view) return;
        state.prevView = state.view; state.view = b.dataset.view; state.viewChanged = true; state.animate = true; state.selDay = null;
        render();
      });
      on("[data-filter]", (b) => { state.filter = b.dataset.filter; state.animate = true; render(); });
      on("[data-goto]", (b) => {
        state.filter = b.dataset.goto; state.prevView = state.view; state.view = "list"; state.viewChanged = true; state.animate = true;
        const [x, y] = centro(b); fxMini(x, y, b.dataset.goto === "cobrados" ? "#4fd699" : "#7fc7ff", 14);
        render();
      });

      on("[data-day]:not([data-action])", (b) => {
        const iso = b.dataset.day;
        state.selDay = state.selDay === iso ? null : iso;
        state.animate = false;
        const [x, y] = centro(b); fxMini(x, y, "#7fc7ff", 12);
        render();
      });
      on('[data-action="cal-prev"]', () => cambiarMes(-1));
      on('[data-action="cal-next"]', () => cambiarMes(1));
      on('[data-action="cal-hoy"]', () => {
        const delta = (hoy.getFullYear() - state.cal.y) * 12 + (hoy.getMonth() - state.cal.m);
        state.cal = { y: hoy.getFullYear(), m: hoy.getMonth() };
        state.calDir = delta === 0 ? 0 : (delta > 0 ? 1 : -1);
        state.selDay = hoyIso; state.animate = false; render();
      });

      on('[data-action="nuevo"]', () => abrirNuevo());
      on('[data-action="nuevo-dia"]', (b) => abrirNuevo(b.dataset.day || undefined));
      on('[data-action="editar"]', (b) => { const job = state.trabajos.find((t) => t.id === b.dataset.id); if (job) abrirEdicion(job); });
      on('[data-action="pedir-borrar"]', (b) => { state.confirmDeleteId = b.dataset.id; state.animate = false; render(); });
      on('[data-action="cancelar-borrar"]', () => { state.confirmDeleteId = null; state.animate = false; render(); });
      on('[data-action="confirm-borrar"]', (b) => borrarTrabajo(b.dataset.id));
      on('[data-action="marcar-cobrado"]', (b) => {
        const job = state.trabajos.find((t) => t.id === b.dataset.id);
        const [x, y] = centro(b);
        state.paidId = b.dataset.id;
        setTimeout(() => { state.paidId = null; }, 2600);
        fxCobrado(x, y, job ? job.monto : 0);
        marcarCobrado(b.dataset.id, true);
      });
      on('[data-action="marcar-por-cobrar"]', (b) => marcarCobrado(b.dataset.id, false));
      on('[data-action="pedir-borrar-gasto"]', (b) => { state.confirmDeleteGasto = b.dataset.id; state.animate = false; render(); });
      on('[data-action="cancelar-borrar-gasto"]', () => { state.confirmDeleteGasto = null; state.animate = false; render(); });
      on('[data-action="confirm-borrar-gasto"]', (b) => borrarGasto(b.dataset.id));
      on('[data-action="editar-saldo"]', () => {
        state.saldoInput = String(saldoBruto() - state.ajuste);
        state.showSaldo = true; state.animate = false; render();
      });
      on('[data-action="cerrar-saldo"]', () => { state.showSaldo = false; state.animate = false; render(); });
      on('[data-action="restablecer-saldo"]', () => guardarSaldo(saldoBruto()));
      const overlaySaldo = document.getElementById("overlay-saldo");
      if (overlaySaldo) overlaySaldo.addEventListener("click", (e) => { if (e.target === overlaySaldo) { state.showSaldo = false; state.animate = false; render(); } });
      const saldoForm = document.getElementById("saldo-form");
      if (saldoForm) {
        saldoForm.addEventListener("submit", (e) => { e.preventDefault(); guardarSaldo(Number(document.getElementById("f-saldo").value)); });
        document.getElementById("f-saldo").addEventListener("input", (e) => { state.saldoInput = e.target.value; });
        document.getElementById("f-saldo").focus();
      }
      on('[data-action="editar-ahorro"]', () => {
        state.ahorroInput = ""; state.ahorroModo = "sumar"; state.ahorroFecha = hoyIso; state.ahorroNota = "";
        state.showAhorro = true; state.animate = false; render();
      });
      on("[data-mov]", (b) => {
        state.ahorroModo = b.dataset.mov;
        state.ahorroInput = b.dataset.mov === "corregir" ? String(Number(state.ahorro.usd) || 0) : "";
        state.animate = false; render();
      });
      on('[data-action="cerrar-ahorro"]', () => { state.showAhorro = false; state.animate = false; render(); });
      const formAhorro = () => ({ modo: state.ahorroModo, monto: state.ahorroInput, fecha: state.ahorroFecha, nota: state.ahorroNota });
      on('[data-action="reiniciar-base"]', () => guardarMovimiento(formAhorro(), true));
      const overlayAhorro = document.getElementById("overlay-ahorro");
      if (overlayAhorro) overlayAhorro.addEventListener("click", (e) => { if (e.target === overlayAhorro) { state.showAhorro = false; state.animate = false; render(); } });
      const ahorroForm = document.getElementById("ahorro-form");
      if (ahorroForm) {
        ahorroForm.addEventListener("submit", (e) => { e.preventDefault(); guardarMovimiento(formAhorro(), false); });
        document.getElementById("f-ahorro").addEventListener("input", (e) => { state.ahorroInput = e.target.value; });
        document.getElementById("f-ahorro-fecha").addEventListener("input", (e) => { state.ahorroFecha = e.target.value; });
        document.getElementById("f-ahorro-nota").addEventListener("input", (e) => { state.ahorroNota = e.target.value; });
        document.getElementById("f-ahorro").focus();
      }
      on('[data-alerta="toggle"]', () => guardarAlerta({ activa: !state.alerta.activa }));
      on('[data-alerta="actual"]', () => guardarAlerta({}));
      on('[data-alerta="notif"]', async () => {
        if (!("Notification" in window)) { mostrarAviso("Tu navegador no admite avisos", "Igual vas a ver el cartel dentro de la página.", "flat"); return; }
        await Notification.requestPermission();
        state.animate = false; render();
      });
      on("[data-umbral]", (b) => guardarAlerta({ umbralPct: Number(b.dataset.umbral) }));
      const simInput = document.getElementById("sim-usd");
      if (simInput) simInput.addEventListener("input", (e) => {
        state.simUsd = e.target.value;
        document.getElementById("sim-body").innerHTML = simHtml(e.target.value);
      });
      on("[data-casa]", (b) => {
        state.casa = b.dataset.casa; state.drawAnim = true; state.animate = false;
        cargarDolarHist(state.casa); // carga el historial de ese dólar la primera vez
        render();
      });
      on("[data-tipo]", (b) => { state.tipoCot = b.dataset.tipo; state.drawAnim = true; state.animate = false; render(); });
      on("[data-rango]", (b) => { state.rango = Number(b.dataset.rango); state.drawAnim = true; state.animate = false; render(); });
      on("[data-modo]", (b) => { state.chartModo = b.dataset.modo; state.drawAnim = true; state.animate = false; render(); });

      // Gráfico del dólar: línea guía y valor al pasar el mouse / dedo
      const ch = document.getElementById("dchart");
      if (ch && state.chartPts.length) {
        const tip = document.getElementById("dtip"), cl = document.getElementById("dcl"), cc = document.getElementById("dcc");
        const ocultar = () => { tip.style.opacity = 0; cl.setAttribute("opacity", 0); cc.setAttribute("opacity", 0); };
        const mover = (e) => {
          const r = ch.getBoundingClientRect(), x = ((e.clientX - r.left) / r.width) * CH_W;
          let best = state.chartPts[0];
          for (const p of state.chartPts) if (Math.abs(p.x - x) < Math.abs(best.x - x)) best = p;
          cl.setAttribute("x1", best.x); cl.setAttribute("x2", best.x); cl.setAttribute("opacity", 1);
          cc.setAttribute("cx", best.x); cc.setAttribute("cy", best.y); cc.setAttribute("opacity", 1);
          tip.innerHTML = `${fechaCorta(best.fecha)}<br><b>${state.chartFmt === "usd" ? usd(best.v) : money(best.v)}</b>`;
          tip.style.left = (best.x / CH_W) * r.width + "px";
          tip.style.top = (best.y / CH_H) * r.height + "px";
          tip.style.opacity = 1;
        };
        ch.addEventListener("pointermove", mover);
        ch.addEventListener("pointerdown", mover);
        ch.addEventListener("pointerleave", ocultar);
      }
      on('[data-action="logout"]', () => handleLogout());
      on('[data-action="cerrar-form"]', () => cerrarForm());

      const overlay = document.getElementById("overlay");
      if (overlay) overlay.addEventListener("click", (e) => { if (e.target === overlay) cerrarForm(); });

      on("[data-bool]", (b) => {
        state.form.facturaEnviada = b.dataset.bool === "true";
        const box = b.parentElement, v = state.form.facturaEnviada;
        box.querySelector('[data-bool="true"]').className = v ? "sel" : "";
        box.querySelector('[data-bool="false"]').className = !v ? "sel no" : "";
        if (v) { const [x, y] = centro(b); fxMini(x, y, "#4fd699", 18); }
      });

      const jobForm = document.getElementById("job-form");
      if (jobForm) {
        jobForm.addEventListener("submit", guardarTrabajo);
        document.getElementById("f-fecha").addEventListener("input", (e) => state.form.fecha = e.target.value);
        document.getElementById("f-lugar").addEventListener("input", (e) => state.form.lugar = e.target.value);
        document.getElementById("f-facturador").addEventListener("input", (e) => state.form.facturador = e.target.value);
        document.getElementById("f-monto").addEventListener("input", (e) => state.form.monto = e.target.value);
      }

      if (window.lucide) window.lucide.createIcons();
    }

    function render() {
      const appEl = document.getElementById("app");
      appEl.className = state.animate ? "anim" : "";
      if (!state.authReady) {
        appEl.innerHTML = `<div class="loading-wrap"><i data-lucide="loader-2" class="spin"></i> Cargando...</div>`;
      } else if (!state.user) {
        appEl.innerHTML = renderLogin();
      } else {
        appEl.innerHTML = renderApp();
      }
      attachListeners();
      animateNumbers();
      state.animate = false;
      state.viewChanged = false;
      state.calDir = 0;
    }

    render();
  </script>
</body>
</html>
